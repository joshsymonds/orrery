name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run the repository check
        run: TMPDIR=/tmp TERM=xterm-256color nix develop -c just check

      - name: Run the flake check
        run: nix flake check

      - name: Run the Android lint and unit tests
        run: nix develop -c just android-test
