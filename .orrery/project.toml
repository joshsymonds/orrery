# orrery's own project file. An epic whose contract names no release steps releases by these, read at its base.
#
# Each step names a kind, so orreryd carries it out as code and checks its postcondition in code, and the release needs
# no judge (internal/releasestep). A postcondition that already holds is met: a main, a tag, a pin or a running build
# that has moved past the release's commit and still contains it is never moved back.

[release]
then = "origin main and a tag that contains the released commit name it, nix-config pins that tag or a newer one, and orreryd and orrery-serve run it."

[[release.steps]]
step = "1 Fast-forward origin's main to the epic's release candidate and push it, so main holds the change; do not wait for CI. A refused push stops the release, and the step never merges, rebases or force-pushes."
target = "github.com/joshsymonds/orrery, branch main"
undo = "Push a revert of the change to main."
kind = "push-main"
branch = "main"

[[release.steps]]
step = "2 Push a signed annotated tag at the candidate, named the next patch version above the newest v* tag, with a message naming the change. A newer v* tag on origin that contains the candidate meets the step."
target = "github.com/joshsymonds/orrery, the new tag"
undo = "git push --delete origin <tag> and delete the local tag."
kind = "tag"
prefix = "v"

[[release.steps]]
step = "3 Pin ~/nix-config's orrery input to the newest v* tag that contains the candidate, in flake.nix and flake.lock, and push the pin to nix-config's origin main; never force-push."
target = "~/nix-config, branch main on its origin"
undo = "Commit flake.nix and flake.lock back to the previous tag."
kind = "pin-flake"
branch = "main"
prefix = "v"
flake = "~/nix-config"
input = "orrery"
url = "github:joshsymonds/orrery/{tag}"

[[release.steps]]
step = "4 Bring ~/nix-config up to its origin main, run `update`, and check that orreryd and orrery-serve run a build that contains the candidate."
target = "vermissian user services and the orrery store"
undo = "Undo step 3, then run `update`; when the tag added a store migration, fix forward with a new release instead, since an older orreryd refuses the migrated store."
kind = "update"
branch = "main"
flake = "~/nix-config"
run = ["update"]
units = ["orreryd", "orrery-serve"]

# The runner sits under [release], not at the top level: orreryd refuses any unknown top-level key of this file on every
# gate grant, and it accepts every key under release.
[[release.runners]]
name = "box"
argv = ["scripts/gate-remote.sh"]
note = "Use box for module-wide Go tests (go test over many packages or ./...), web-check and Android tests, which are heavy. Run single-package or narrow Go tests locally."
