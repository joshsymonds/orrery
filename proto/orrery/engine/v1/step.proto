syntax = "proto3";

package orrery.engine.v1;

// Steps runs steps: agent loops that end with a checked status. orreryd serves it on the same private socket as Engine,
// mode 0600. serve reads ListSteps and StepStatus and forwards the owner's HoldStep, NudgeStep and StopStep through
// orrery.v1.Steps, and never calls StartStep.
service Steps {
  // StartStep starts a step and returns its id once its row exists. A start that is refused returns the refusal and no
  // id. A writing step runs in its workspace; a read-only step runs in a detached worktree at its revision.
  rpc StartStep(StartStepRequest) returns (StartStepResponse);

  // StopStep ends a step's loop. A held or running step ends as stopped.
  rpc StopStep(StopStepRequest) returns (StopStepResponse);

  // StepStatus returns a step's row.
  rpc StepStatus(StepStatusRequest) returns (StepStatusResponse);

  // ReadStepResult returns one part of a step's result. A request that names no field returns the outline of a result
  // that is a JSON object, and the raw text of any other result, paged. A request that names a field returns that
  // field's value, and one that also names an item returns one element of that array field. A value is paged over its
  // runes: it is cut to the request's limit from its offset, and next_offset names where the rest starts.
  rpc ReadStepResult(ReadStepResultRequest) returns (ReadStepResultResponse);

  // ReadStepCheck returns one check's detail and a slice of its kept output, bounded. The check is the one the request
  // names, in the round it names or in its last round. The output is a slice of the check's kept gate log, or of its
  // stored stdout and stderr when no log was kept: at most 80 lines, each cut to 150 runes, and the detail is cut to
  // 4000 runes.
  rpc ReadStepCheck(ReadStepCheckRequest) returns (ReadStepCheckResponse);

  // ListSteps lists the labelled steps, oldest first. An unlabelled step is never listed. A listed step carries no
  // result: its summary, red_evidence and green_evidence carry what a list reads of it. A list of the running steps also
  // counts, by epic, the matching steps that have ended, without reading them.
  rpc ListSteps(ListStepsRequest) returns (ListStepsResponse);

  // HoldStep interrupts the step's running turn and holds the step until a nudge or a stop. The interrupted turn is no
  // round. A step with no turn running, one already held, or one running its gate refuses with failed_precondition.
  rpc HoldStep(HoldStepRequest) returns (HoldStepResponse);

  // NudgeStep sends the owner's text to the step. A held step resumes with it. A running turn is interrupted and the
  // step continued with the text instead of a round. A step with no turn running, or one running its gate, refuses with
  // failed_precondition. OK means the nudge landed; it neither spends nor replaces the watchdog's nudge.
  rpc NudgeStep(NudgeStepRequest) returns (NudgeStepResponse);

  // ResumeStep resumes a step a usage limit holds: the owner's prompt that the limit has reset respawns the step's
  // process in its session. A step no limit holds refuses with failed_precondition, a step at the step cap with
  // resource_exhausted, and an id with no row with not_found.
  rpc ResumeStep(ResumeStepRequest) returns (ResumeStepResponse);
}

// StartStepRequest asks for a new step.
message StartStepRequest {
  // The agent the step runs as.
  string agent = 1;

  // The step's first prompt.
  string prompt = 2;

  // The JSON schema the step's done return must match.
  string schema = 3;

  // The absolute directory the step runs in. A writing step runs in it; a read-only step adds its worktree to it.
  string workspace = 4;

  // The revision the step starts at. Empty means HEAD.
  string revision = 5;

  // Whether the step is read-only. A read-only step runs in a detached worktree removed when the step ends.
  bool read_only = 6;

  // The paths, relative to the repository, a writing step may change.
  repeated string owned_paths = 7;

  // Refused: StartStep returns invalid_argument when this is set. A step names its gate with gate_name.
  repeated string gate = 8;

  // Refused: StartStep returns invalid_argument when this is set. A step names its gate with gate_name.
  uint32 gate_limit_seconds = 9;

  // The status the step's done return carries. Empty means "done".
  string done_value = 10;

  // How many seconds of model time the step may use. Zero means 60 minutes.
  uint32 model_limit_seconds = 11;

  // The epic the step belongs to, as `<repo-id>/<epic-slug>`. Empty leaves the step unlabelled, and an unlabelled step is
  // never listed.
  string epic = 12;

  // The slug of the epic's task the step works on. Empty when it works on no one task.
  string task = 13;

  // The name of the gate the step's return is checked against, resolved once when the step starts. Empty runs no gate.
  string gate_name = 14;

  // The absolute path of the epic's gates file. Empty reads only the project file.
  string gates_file = 15;
}

// StartStepResponse names the started step.
message StartStepResponse {
  // The new step's id.
  string id = 1;
}

// StopStepRequest asks for a step's loop to end.
message StopStepRequest {
  // The step's id.
  string id = 1;
}

// StopStepResponse acknowledges a stop. It has no fields.
message StopStepResponse {}

// StepStatusRequest asks for a step's row.
message StepStatusRequest {
  // The step's id.
  string id = 1;
}

// StepStatusResponse carries a step's row.
message StepStatusResponse {
  // The step.
  Step step = 1;
}

// Step is a step's row.
message Step {
  // The step's id.
  string id = 1;

  // The agent the step runs as.
  string agent = 2;

  // The directory the step runs in.
  string workspace = 3;

  // The commit the step started at.
  string revision = 4;

  // Whether the step is read-only.
  bool read_only = 5;

  // The worktree the step runs in. Empty for a writing step, which runs in its workspace.
  string worktree = 6;

  // How the step ended. Empty while it runs.
  string end = 7;

  // The step's status: the done value its return carried, or the status it ended with.
  string status = 8;

  // The step's latest result, as its return carried it. Empty in a ListSteps answer, which carries summary,
  // red_evidence and green_evidence instead.
  string result = 9;

  // The checks the step's returns ran, in the rounds they ran in.
  repeated StepCheck checks = 10;

  // Why the step ended. Empty while it runs.
  string reason = 11;

  // When the step started, in unix seconds.
  int64 started = 12;

  // When the step ended, in unix seconds. Zero while it runs.
  int64 ended = 13;

  // The step's latest doing line from its monitor. Empty until the first check.
  string doing = 14;

  // The epic the step belongs to, as started. Empty when the step is unlabelled.
  string epic = 15;

  // The slug of the epic's task the step works on, as started. Empty when it works on no one task.
  string task = 16;

  // Whether an owner hold interrupted the step's turn and it waits for a nudge or a stop.
  bool held = 17;

  // Whether a usage limit holds the step, so that it waits for a resume.
  bool limited = 18;

  // The kind of usage limit that holds the step. Empty when no limit holds it or the kind is unknown.
  string limit_kind = 19;

  // When the usage limit that holds the step resets, in unix seconds. Zero when no limit holds it or the reset is
  // unknown.
  int64 limit_resets = 20;

  // The stage the step is in, such as turn, checks, gate, judge, held or limited. Empty when the row stores no stage.
  string stage = 21;

  // When the step's stage started, in unix seconds. Zero when the row stores no start.
  int64 stage_started = 22;

  // The name of the gate the step runs. Empty when the step runs no named gate.
  string gate_name = 23;

  // The most seconds the step's gate may run, in whole seconds.
  int64 gate_limit_seconds = 24;

  // The verdicts the step's monitor and judge gave, in the order they were recorded.
  repeated StepVerdict verdicts = 25;

  // The id of the sessions row of the session that started the step. Empty when the start named no caller, or when the
  // caller had no row.
  string caller = 26;

  // The string summary of the step's latest result. Empty when the result is not a JSON object, has no summary, or has
  // one that is not a string. A key the result holds more than once is read at its last value, here and in
  // red_evidence and green_evidence.
  string summary = 27;

  // Whether the step's latest result is a JSON object whose red_evidence is a string that, trimmed of white space, is
  // not empty and does not start with NOT RUN in any case.
  bool red_evidence = 28;

  // Whether the step's latest result is a JSON object whose green_evidence is a string that, trimmed of white space, is
  // not empty and does not start with NOT RUN in any case.
  bool green_evidence = 29;
}

// ReadStepResultRequest asks for part of a step's result.
message ReadStepResultRequest {
  // The step's id.
  string id = 1;

  // The top-level field of the result to read. Empty reads the outline of a result that is a JSON object, or the raw
  // text of any other result.
  string field = 2;

  // The element of the array field to read: the first element that is an object whose id property equals item, or,
  // when no element has such an id and item is a decimal integer, the element at that 0-based index. Requires field.
  string item = 3;

  // The rune offset the value starts at. Paging applies to a value, so an outline ignores it.
  uint32 offset = 4;

  // The most runes the value holds. Zero means 4000, and a larger limit reads as 4000.
  uint32 limit = 5;
}

// ReadStepResultResponse carries the part of the result the request asked for.
message ReadStepResultResponse {
  // The top-level fields of a result that is a JSON object, when the request names no field, in the order the object
  // first holds them. Empty for any other part.
  repeated StepResultField outline = 1;

  // The part's value, cut to the request's limit runes from its offset. Empty for an outline.
  string value = 2;

  // Whether value is compact JSON. False means value is the raw text of a string, or the raw text of a result that is
  // not a JSON object.
  bool json = 3;

  // The rune offset value starts at.
  uint32 offset = 4;

  // The offset to continue from to read the rest of the part, or zero when value reaches the end of the part.
  uint32 next_offset = 5;

  // The rune count of the whole part. Zero for an outline.
  uint32 total = 6;
}

// StepResultField is one top-level field of a step's result, as an outline lists it.
message StepResultField {
  // The field's name.
  string name = 1;

  // The field's JSON type: string, number, boolean, null, object or array.
  string type = 2;

  // The field's size: the runes of a string, the elements of an array, the keys of an object, and the bytes of the JSON
  // text of a number, boolean or null.
  uint32 size = 3;
}

// ReadStepCheckRequest asks for one check of a step and a slice of its kept output.
message ReadStepCheckRequest {
  // The step's id.
  string id = 1;

  // The name of the check to read. An empty or unknown name is refused, and the refusal names the step's checks.
  string check = 2;

  // The round to read the check in. Zero reads the check's last round. A round the check did not run in is refused, and
  // the refusal names the rounds it ran in.
  uint32 round = 3;

  // The most lines the slice holds. Zero means 40, and a larger count reads as 80.
  uint32 lines = 4;

  // The line the slice ends before, numbered from 1: the slice holds the lines numbered below it. Zero means after the
  // last line. A number past the total lines + 1 is refused, and next_before pages backward from a slice.
  uint32 before = 5;

  // Only the lines that contain this text, as plain text. Empty keeps every line.
  string match = 6;
}

// ReadStepCheckResponse carries one check's detail and the slice of its output the request asked for.
message ReadStepCheckResponse {
  // The round the check ran in.
  uint32 round = 1;

  // The check's name.
  string name = 2;

  // Whether the check passed.
  bool ok = 3;

  // The check's detail, cut to 4000 runes: 3999 runes and an ellipsis when it is longer.
  string detail = 4;

  // Whether output is the check's kept gate log. False means output is built from the check's stored stdout and stderr.
  bool kept = 5;

  // The slice's lines joined with newlines, each line cut to 150 runes: 149 runes and an ellipsis when it is longer.
  string output = 6;

  // The number of the slice's first line, numbered from 1 over the lines that match. Zero when the slice is empty.
  uint32 first_line = 7;

  // The count of the lines that match the request's match: the lines the slice is taken from.
  uint32 total = 8;

  // The before that reads the lines above the slice: first_line when it is past line 1, otherwise zero.
  uint32 next_before = 9;
}

// ListStepsRequest asks for the labelled steps.
message ListStepsRequest {
  // Only steps with this epic. Empty means every labelled step.
  string epic = 1;

  // Only steps with this task. Empty means any task.
  string task = 2;

  // Only steps that have not ended, held ones among them. The answer then counts the matching steps that have ended in
  // ended.
  bool running = 3;
}

// ListStepsResponse carries the matching steps, oldest first.
message ListStepsResponse {
  // The matching steps.
  repeated Step steps = 1;

  // By epic, how many of the labelled steps that match the request's epic and task have ended. Filled only when the
  // request asks for running steps; an epic none of whose matching steps has ended is left out.
  map<string, int32> ended = 2;
}

// HoldStepRequest asks for a step to be held.
message HoldStepRequest {
  // The step's id.
  string id = 1;
}

// HoldStepResponse acknowledges a hold. It has no fields.
message HoldStepResponse {}

// NudgeStepRequest asks for the owner's text to be sent to a step.
message NudgeStepRequest {
  // The step's id.
  string id = 1;

  // The owner's text.
  string text = 2;
}

// NudgeStepResponse acknowledges a nudge. It has no fields.
message NudgeStepResponse {}

// ResumeStepRequest asks for a limited step to be resumed.
message ResumeStepRequest {
  // The step's id.
  string id = 1;
}

// ResumeStepResponse acknowledges a resume. It has no fields.
message ResumeStepResponse {}

// StepCheck is one check a step's return ran.
message StepCheck {
  // The round the check ran in.
  uint32 round = 1;

  // The check's name.
  string name = 2;

  // Whether the check passed.
  bool ok = 3;

  // The check's detail, such as the failure it reported.
  string detail = 4;

  // The tail of the check's stdout, redacted.
  string stdout = 5;

  // The tail of the check's stderr, redacted.
  string stderr = 6;

  // The file a failed gate check's output was kept in, stdout then stderr, each redacted, under the gate state
  // directory. Empty for any other check.
  string log = 7;
}

// StepVerdict is one verdict the step's monitor or judge gave.
message StepVerdict {
  // The round the verdict was given in.
  uint32 round = 1;

  // The kind of verdict: monitor or judge.
  string kind = 2;

  // The verdict the call gave. Empty when the call failed.
  string verdict = 3;

  // The verdict's detail, such as the reason it gave.
  string detail = 4;
}
