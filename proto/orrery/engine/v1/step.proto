syntax = "proto3";

package orrery.engine.v1;

// Steps runs steps: agent loops that end with a checked status. orreryd serves it on the same private socket as Engine,
// mode 0600. serve reads ListSteps and StepStatus and forwards the owner's HoldStep, NudgeStep and StopStep through
// orrery.v1.Steps, and never calls StartStep.
service Steps {
  // StartStep starts a step and returns its id once its row exists. A start that is refused returns the refusal and no
  // id. A writing step runs in its workspace; a read-only step runs in a detached worktree at its revision.
  rpc StartStep(StartStepRequest) returns (StartStepResponse);

  // StopStep ends a step's loop. A held or running step ends as stopped.
  rpc StopStep(StopStepRequest) returns (StopStepResponse);

  // StepStatus returns a step's row.
  rpc StepStatus(StepStatusRequest) returns (StepStatusResponse);

  // ListSteps lists the labelled steps, oldest first. An unlabelled step is never listed.
  rpc ListSteps(ListStepsRequest) returns (ListStepsResponse);

  // HoldStep interrupts the step's running turn and holds the step until a nudge or a stop. The interrupted turn is no
  // round. A step with no turn running, one already held, or one running its gate refuses with failed_precondition.
  rpc HoldStep(HoldStepRequest) returns (HoldStepResponse);

  // NudgeStep sends the owner's text to the step. A held step resumes with it. A running turn is interrupted and the
  // step continued with the text instead of a round. A step with no turn running, or one running its gate, refuses with
  // failed_precondition. OK means the nudge landed; it neither spends nor replaces the watchdog's nudge.
  rpc NudgeStep(NudgeStepRequest) returns (NudgeStepResponse);

  // ResumeStep resumes a step a usage limit holds: the owner's prompt that the limit has reset respawns the step's
  // process in its session. A step no limit holds refuses with failed_precondition, a step at the step cap with
  // resource_exhausted, and an id with no row with not_found.
  rpc ResumeStep(ResumeStepRequest) returns (ResumeStepResponse);
}

// StartStepRequest asks for a new step.
message StartStepRequest {
  // The agent the step runs as.
  string agent = 1;

  // The step's first prompt.
  string prompt = 2;

  // The JSON schema the step's done return must match.
  string schema = 3;

  // The absolute directory the step runs in. A writing step runs in it; a read-only step adds its worktree to it.
  string workspace = 4;

  // The revision the step starts at. Empty means HEAD.
  string revision = 5;

  // Whether the step is read-only. A read-only step runs in a detached worktree removed when the step ends.
  bool read_only = 6;

  // The paths, relative to the repository, a writing step may change.
  repeated string owned_paths = 7;

  // Refused: StartStep returns invalid_argument when this is set. A step names its gate with gate_name.
  repeated string gate = 8;

  // Refused: StartStep returns invalid_argument when this is set. A step names its gate with gate_name.
  uint32 gate_limit_seconds = 9;

  // The status the step's done return carries. Empty means "done".
  string done_value = 10;

  // How many seconds of model time the step may use. Zero means 60 minutes.
  uint32 model_limit_seconds = 11;

  // The epic the step belongs to, as `<repo-id>/<epic-slug>`. Empty leaves the step unlabelled, and an unlabelled step is
  // never listed.
  string epic = 12;

  // The slug of the epic's task the step works on. Empty when it works on no one task.
  string task = 13;

  // The name of the gate the step's return is checked against, resolved once when the step starts. Empty runs no gate.
  string gate_name = 14;

  // The absolute path of the epic's gates file. Empty reads only the project file.
  string gates_file = 15;
}

// StartStepResponse names the started step.
message StartStepResponse {
  // The new step's id.
  string id = 1;
}

// StopStepRequest asks for a step's loop to end.
message StopStepRequest {
  // The step's id.
  string id = 1;
}

// StopStepResponse acknowledges a stop. It has no fields.
message StopStepResponse {}

// StepStatusRequest asks for a step's row.
message StepStatusRequest {
  // The step's id.
  string id = 1;
}

// StepStatusResponse carries a step's row.
message StepStatusResponse {
  // The step.
  Step step = 1;
}

// Step is a step's row.
message Step {
  // The step's id.
  string id = 1;

  // The agent the step runs as.
  string agent = 2;

  // The directory the step runs in.
  string workspace = 3;

  // The commit the step started at.
  string revision = 4;

  // Whether the step is read-only.
  bool read_only = 5;

  // The worktree the step runs in. Empty for a writing step, which runs in its workspace.
  string worktree = 6;

  // How the step ended. Empty while it runs.
  string end = 7;

  // The step's status: the done value its return carried, or the status it ended with.
  string status = 8;

  // The step's latest result, as its return carried it.
  string result = 9;

  // The checks the step's returns ran, in the rounds they ran in.
  repeated StepCheck checks = 10;

  // Why the step ended. Empty while it runs.
  string reason = 11;

  // When the step started, in unix seconds.
  int64 started = 12;

  // When the step ended, in unix seconds. Zero while it runs.
  int64 ended = 13;

  // The step's latest doing line from its monitor. Empty until the first check.
  string doing = 14;

  // The epic the step belongs to, as started. Empty when the step is unlabelled.
  string epic = 15;

  // The slug of the epic's task the step works on, as started. Empty when it works on no one task.
  string task = 16;

  // Whether an owner hold interrupted the step's turn and it waits for a nudge or a stop.
  bool held = 17;

  // Whether a usage limit holds the step, so that it waits for a resume.
  bool limited = 18;

  // The kind of usage limit that holds the step. Empty when no limit holds it or the kind is unknown.
  string limit_kind = 19;

  // When the usage limit that holds the step resets, in unix seconds. Zero when no limit holds it or the reset is
  // unknown.
  int64 limit_resets = 20;

  // The stage the step is in, such as turn, checks, gate, judge, held or limited. Empty when the row stores no stage.
  string stage = 21;

  // When the step's stage started, in unix seconds. Zero when the row stores no start.
  int64 stage_started = 22;

  // The name of the gate the step runs. Empty when the step runs no named gate.
  string gate_name = 23;

  // The most seconds the step's gate may run, in whole seconds.
  int64 gate_limit_seconds = 24;

  // The verdicts the step's monitor and judge gave, in the order they were recorded.
  repeated StepVerdict verdicts = 25;

  // The id of the sessions row of the session that started the step. Empty when the start named no caller, or when the
  // caller had no row.
  string caller = 26;
}

// ListStepsRequest asks for the labelled steps.
message ListStepsRequest {
  // Only steps with this epic. Empty means every labelled step.
  string epic = 1;

  // Only steps with this task. Empty means any task.
  string task = 2;
}

// ListStepsResponse carries the matching steps, oldest first.
message ListStepsResponse {
  // The matching steps.
  repeated Step steps = 1;
}

// HoldStepRequest asks for a step to be held.
message HoldStepRequest {
  // The step's id.
  string id = 1;
}

// HoldStepResponse acknowledges a hold. It has no fields.
message HoldStepResponse {}

// NudgeStepRequest asks for the owner's text to be sent to a step.
message NudgeStepRequest {
  // The step's id.
  string id = 1;

  // The owner's text.
  string text = 2;
}

// NudgeStepResponse acknowledges a nudge. It has no fields.
message NudgeStepResponse {}

// ResumeStepRequest asks for a limited step to be resumed.
message ResumeStepRequest {
  // The step's id.
  string id = 1;
}

// ResumeStepResponse acknowledges a resume. It has no fields.
message ResumeStepResponse {}

// StepCheck is one check a step's return ran.
message StepCheck {
  // The round the check ran in.
  uint32 round = 1;

  // The check's name.
  string name = 2;

  // Whether the check passed.
  bool ok = 3;

  // The check's detail, such as the failure it reported.
  string detail = 4;

  // The tail of the check's stdout, redacted.
  string stdout = 5;

  // The tail of the check's stderr, redacted.
  string stderr = 6;

  // The file a failed gate check's output was kept in, stdout then stderr, each redacted, under the gate state
  // directory. Empty for any other check.
  string log = 7;
}

// StepVerdict is one verdict the step's monitor or judge gave.
message StepVerdict {
  // The round the verdict was given in.
  uint32 round = 1;

  // The kind of verdict: monitor or judge.
  string kind = 2;

  // The verdict the call gave. Empty when the call failed.
  string verdict = 3;

  // The verdict's detail, such as the reason it gave.
  string detail = 4;
}
