syntax = "proto3";

package orrery.engine.v1;

// Pools grants pool members to a client. orreryd serves it on the same private socket as Engine and Steps, mode 0600,
// and never on the public orrery serve API.
service Pools {
  // Acquire asks for every need at once and streams the request's place in line until it is granted. The grant lives
  // while the response stream is open and ends when it closes. A member is in at most one grant at a time. A hold on a
  // member a grant holds sends that grant a stop event, see AcquireStop. A request refuses with failed_precondition
  // for a pool another host owns, or for a pool or member defined two ways, with invalid_argument for a bad need, with
  // not_found for a grant_id that names no stored grant, and with unavailable when orreryd has no store to keep grants
  // in.
  rpc Acquire(AcquireRequest) returns (stream AcquireResponse);

  // Status reports the pools in use, each with its members and the requests waiting for it, and every owner hold.
  rpc Status(PoolsStatusRequest) returns (PoolsStatusResponse);

  // Hold holds a member by name. A held member is never granted. A hold on a granted member stops its grant, and a hold
  // on a member of no pool in use is accepted. Hold of a held member succeeds and keeps the first hold's since. A member
  // name outside [A-Za-z0-9][A-Za-z0-9._-]* is invalid_argument. With no store to keep holds in, Hold is unavailable.
  rpc Hold(PoolsHoldRequest) returns (PoolsHoldResponse);

  // Free releases a held member. Free of a member not held is not_found. A member name outside
  // [A-Za-z0-9][A-Za-z0-9._-]* is invalid_argument. With no store to keep holds in, Free is unavailable.
  rpc Free(PoolsFreeRequest) returns (PoolsFreeResponse);
}

// AcquireRequest asks for the members of every need at once.
message AcquireRequest {
  // The absolute path of the project the request is for. Members a project holds from a pool count against its cap.
  string project = 1;

  // The pools the project's files define. Each need names one of them.
  repeated PoolDefinition pools = 2;

  // The members the command needs, one entry per pool.
  repeated PoolNeed needs = 3;

  // The client's process id. orreryd ends the grant when this process is gone.
  int32 client_pid = 4;

  // The grant_id an earlier AcquireGranted carried, set only to reclaim that grant after orreryd restarted. Empty for a
  // new request.
  string grant_id = 5;

  // The argv of the command the grant is for, as Status shows it. Empty when the client sends none.
  repeated string command = 6;
}

// PoolDefinition is one pool as a project's or the machine's files define it.
message PoolDefinition {
  // The pool's name. A need names the pool by it.
  string name = 1;

  // The host that owns the pool. orreryd refuses a pool whose host is not its own.
  string host = 2;

  // How many of the pool's members one project may hold at once.
  int32 cap = 3;

  // The pool's members, by name. A member belongs to one pool.
  repeated string members = 4;

  // The argv, run without a shell, that wakes a member. It must exit 0 once the member is awake.
  repeated string wake = 5;

  // How many seconds the wake command may run. A wake that does not exit 0 in time leaves the member unavailable.
  int64 wake_limit_seconds = 6;

  // The argv, run without a shell, that reports a member's state: exit 0 when it is awake, nonzero when it is asleep.
  // orreryd runs it when the pool is first used and every 60 seconds after. A member left unavailable by a failed wake,
  // admit or status comes back only when a later status run exits 0.
  repeated string status = 7;

  // How many seconds the status command may run. A status command that fails to start or passes this limit leaves the
  // member unavailable.
  int64 status_limit_seconds = 8;

  // The argv, run without a shell, that admits an awake member for grants. It must exit 0 once the member is admitted.
  repeated string admit = 9;

  // How many seconds the admit command may run. An admit that does not exit 0 in time leaves the member unavailable.
  int64 admit_limit_seconds = 10;
}

// PoolNeed asks for a count of one pool's members.
message PoolNeed {
  // The pool, by the name its definition gives.
  string pool = 1;

  // How many of the pool's members the command needs. Must be at least one, and no more than the pool's cap.
  int32 count = 2;
}

// AcquireResponse is one event in an acquire: the request waiting in line, granted, or stopped.
message AcquireResponse {
  oneof event {
    // The request waits for its members.
    AcquireQueued queued = 1;

    // The request holds its members until the response stream closes.
    AcquireGranted granted = 2;

    // The grant stops because one of its members is held.
    AcquireStop stop = 3;
  }
}

// AcquireQueued says the request waits for its members.
message AcquireQueued {
  // The request's place in line, counting from 1. One is next.
  int32 position = 1;
}

// AcquireGranted says the request holds its members.
message AcquireGranted {
  // The grant's id. A client that reconnects after orreryd restarts gives it back in grant_id to reclaim the grant.
  string grant_id = 1;

  // The members granted, for each pool a need named.
  repeated PoolMembers pools = 2;
}

// PoolMembers names the members granted from one pool.
message PoolMembers {
  // The pool the members belong to.
  string pool = 1;

  // The members granted, by name.
  repeated string members = 2;
}

// AcquireStop says the grant stops because one of its members is held. The client stops its command, closes the
// stream, and reclaims the grant by its grant_id to wait at its place in line.
message AcquireStop {
  // The members of the grant that are held. The grant ends when its stream closes, and its members are freed then.
  repeated string members = 1;
}

// PoolsStatusRequest asks for the pools in use and the owner holds. It has no fields.
message PoolsStatusRequest {}

// PoolsStatusResponse carries the pools in use and the owner holds.
message PoolsStatusResponse {
  // The pools in use, sorted by name.
  repeated PoolStatus pools = 1;

  // Every owner hold, sorted by member. It covers holds on members of no pool in use.
  repeated PoolHold holds = 2;
}

// PoolStatus is one pool in use: its cap, its members, and the requests waiting for it.
message PoolStatus {
  // The pool's name.
  string name = 1;

  // How many of the pool's members one project may hold at once.
  int32 cap = 2;

  // The pool's members, in the order its definition declares them.
  repeated PoolMemberStatus members = 3;

  // The requests waiting for the pool, in queue order.
  repeated PoolWaiter waiters = 4;
}

// PoolMemberStatus is one member of a pool in use.
message PoolMemberStatus {
  // The member's name.
  string name = 1;

  // The member's state: unknown, asleep, awake, waking, admitting, admitted, or unavailable.
  string state = 2;

  // The grant that holds the member, unset when no grant holds it.
  PoolHolder holder = 3;

  // The unix seconds the member was held, or 0 when it is not held.
  int64 held_since = 4;
}

// PoolHolder is the grant that holds a member.
message PoolHolder {
  // The grant's id.
  string grant_id = 1;

  // The absolute path of the grant's project.
  string project = 2;

  // The client's process id.
  int32 client_pid = 3;

  // The argv of the grant's command. Empty when the client sent none.
  repeated string command = 4;

  // The unix seconds the grant was granted.
  int64 since = 5;

  // Whether the grant is stopping, because one of its members is held.
  bool stopping = 6;
}

// PoolWaiter is one request waiting for a pool.
message PoolWaiter {
  // The request's place in line, counting from 1.
  int32 position = 1;

  // The absolute path of the request's project.
  string project = 2;

  // The argv of the request's command. Empty when the client sent none.
  repeated string command = 3;

  // How many of the pool's members the request needs.
  int32 count = 4;

  // The unix seconds the request began waiting.
  int64 since = 5;
}

// PoolHold is one owner hold: a member that no grant may take.
message PoolHold {
  // The held member's name.
  string member = 1;

  // The unix seconds the member was held.
  int64 since = 2;
}

// PoolsHoldRequest asks for a member to be held.
message PoolsHoldRequest {
  // The member's name, of the form [A-Za-z0-9][A-Za-z0-9._-]*.
  string member = 1;
}

// PoolsHoldResponse is the reply to a Hold. It has no fields.
message PoolsHoldResponse {}

// PoolsFreeRequest asks for a held member to be freed.
message PoolsFreeRequest {
  // The member's name, of the form [A-Za-z0-9][A-Za-z0-9._-]*.
  string member = 1;
}

// PoolsFreeResponse is the reply to a Free. It has no fields.
message PoolsFreeResponse {}
