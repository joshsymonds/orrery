syntax = "proto3";

package orrery.engine.v1;

// Engine drives headless Claude Code sessions. orreryd serves it on a private socket in the runtime directory, mode
// 0600, and never on the public orrery serve API.
service Engine {
  // Start starts a headless session in an existing absolute directory with a first prompt and returns once its row
  // exists and its process is spawned. A start past the session cap is refused with a reason. A start that names an
  // existing session's id returns that id and starts nothing.
  rpc Start(StartRequest) returns (StartResponse);

  // Say sends a text message to a session's conversation.
  rpc Say(SayRequest) returns (SayResponse);

  // Answer replies to a session's open question. The answer is a question's option label, or allow or deny for a
  // permission request.
  rpc Answer(AnswerRequest) returns (AnswerResponse);

  // Interrupt stops a session's current turn.
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);

  // Decline denies an open question or permission request of a session and ends its turn, as Interrupt does. It is
  // refused unless the request is open.
  rpc Decline(DeclineRequest) returns (DeclineResponse);

  // Stop ends a session's process.
  rpc Stop(StopRequest) returns (StopResponse);

  // Seen marks a session's conversation as read.
  rpc Seen(SeenRequest) returns (SeenResponse);

  // Resume resumes an interrupted session's turn by sending its resume prompt. A session that is not interrupted, or
  // has no Claude session to resume, is refused.
  rpc Resume(ResumeRequest) returns (ResumeResponse);

  // Withdraw asks Claude to cancel one queued owner message of a session by its prompt_id (cancel_async_message). Its
  // texts hold that message's text when Claude cancelled it, and none when Claude had already taken it in, when the
  // session is not running, or when prompt_id is empty.
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);

  // NotNow has orreryd store the not-now mark on an open question, which keeps it off the owner's list until BringBack.
  rpc NotNow(NotNowRequest) returns (NotNowResponse);

  // BringBack has orreryd clear the not-now mark on an open question.
  rpc BringBack(BringBackRequest) returns (BringBackResponse);
}

// StartRequest asks for a new headless session.
message StartRequest {
  // The existing absolute directory the session runs in.
  string dir = 1;

  // The session's first prompt.
  string prompt = 2;

  // The model alias the session runs, such as haiku. Empty runs claude's default.
  string model = 3;

  // A session id the client chooses, 32 lowercase hex digits. Empty means orreryd mints one. A start whose id names
  // an existing session starts nothing and returns that id.
  string id = 4;
}

// StartResponse names the started session.
message StartResponse {
  // The new session's id.
  string id = 1;
}

// SayRequest sends a text message to a session.
message SayRequest {
  // The session's id.
  string id = 1;

  // The message text.
  string text = 2;

  // An id the client chooses for this prompt. Empty means none. A say whose prompt id the session has already recorded
  // sends nothing and succeeds.
  string prompt_id = 3;
}

// SayResponse acknowledges a message. It has no fields.
message SayResponse {}

// AnswerRequest replies to a session's open question.
message AnswerRequest {
  // The session's id.
  string id = 1;

  // The id of the question or permission request being answered.
  string request_id = 2;

  // The question's option label, or allow or deny for a permission request.
  string answer = 3;
}

// AnswerResponse acknowledges an answer. It has no fields.
message AnswerResponse {}

// InterruptRequest asks for a session's current turn to stop.
message InterruptRequest {
  // The session's id.
  string id = 1;
}

// InterruptResponse acknowledges an interrupt.
message InterruptResponse {
  // The texts of the owner's messages that Claude cancelled from its queue at the interrupt, in send order. A caller
  // event's text is never among them.
  repeated string texts = 1;
}

// DeclineRequest asks a session to deny one open question or permission request and end its turn.
message DeclineRequest {
  // The session's id.
  string id = 1;

  // The id of the question or permission request being declined.
  string request_id = 2;
}

// DeclineResponse carries the texts of the owner's queued messages that Claude cancelled at the decline.
message DeclineResponse {
  // The texts of the owner's messages that Claude cancelled from its queue at the decline, in send order. A caller
  // event's text is never among them.
  repeated string texts = 1;
}

// StopRequest asks for a session's process to end.
message StopRequest {
  // The session's id.
  string id = 1;
}

// StopResponse acknowledges a stop. It has no fields.
message StopResponse {}

// SeenRequest marks a session's conversation as read.
message SeenRequest {
  // The session's id.
  string id = 1;
}

// SeenResponse acknowledges a seen mark. It has no fields.
message SeenResponse {}

// ResumeRequest asks for an interrupted session's turn to resume.
message ResumeRequest {
  // The session's id.
  string id = 1;
}

// ResumeResponse acknowledges a resume. It has no fields.
message ResumeResponse {}

// WithdrawRequest asks Claude to cancel one queued owner message of a session.
message WithdrawRequest {
  // The session's id.
  string id = 1;

  // The prompt id of the queued owner message to cancel. Empty cancels nothing.
  string prompt_id = 2;
}

// WithdrawResponse carries the text of the queued owner message that Claude cancelled.
message WithdrawResponse {
  // That message's text when Claude cancelled it. None when Claude had already taken it in, when the session is not
  // running, or when prompt_id is empty.
  repeated string texts = 1;
}

// NotNowRequest names one open question to take off the owner's list.
message NotNowRequest {
  // The question's kind: "headless" or "pane".
  string kind = 1;

  // The headless session id, or the pane's Pane.id.
  string id = 2;

  // The headless open request's OpenRequest.id. Empty for a pane.
  string request_id = 3;

  // The pane's Pane.question_hash. Empty for headless.
  string question_hash = 4;

  // The pane's Pane.changed, the unix seconds it started waiting. 0 for headless.
  int64 changed = 5;
}

// NotNowResponse acknowledges a not-now mark. It has no fields.
message NotNowResponse {}

// BringBackRequest names one open question to put back on the owner's list.
message BringBackRequest {
  // The question's kind: "headless" or "pane".
  string kind = 1;

  // The headless session id, or the pane's Pane.id.
  string id = 2;

  // The headless open request's OpenRequest.id. Empty for a pane.
  string request_id = 3;

  // The pane's Pane.question_hash. Empty for headless.
  string question_hash = 4;

  // The pane's Pane.changed, the unix seconds it started waiting. 0 for headless.
  int64 changed = 5;
}

// BringBackResponse acknowledges a bring-back. It has no fields.
message BringBackResponse {}
