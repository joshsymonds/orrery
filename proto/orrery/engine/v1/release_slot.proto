syntax = "proto3";

package orrery.engine.v1;

// ReleaseSlots holds a repository's release slot for a label outside an epic, and answers the holds. An outside releaser
// holds a slot for a limit and gives it back when its release is done. orreryd serves it on the same private socket as
// Engine and Steps, mode 0600, and never on the public orrery serve API.
service ReleaseSlots {
  // Hold holds the repository's release slot for holder until limit_seconds from now. The reply says whether holder holds
  // the slot, and names the holder: holder when it holds the slot, otherwise the epic or outside label that does. A slot
  // an epic or another label holds is left as it is. A limit_seconds outside 1 to 7200, an empty holder or a repository
  // that is not an absolute path is invalid_argument.
  rpc Hold(ReleaseSlotsHoldRequest) returns (ReleaseSlotsHoldResponse);

  // HoldWait holds the repository's release slot for holder, as Hold does, and streams the wait. Each time another holder
  // keeps the slot, it sends a waiting event with that holder. Once holder holds the slot, it sends one held event with
  // holder and the stream closes. A stream that ends before then ends with the error it met, such as canceled.
  rpc HoldWait(ReleaseSlotsHoldWaitRequest) returns (stream ReleaseSlotsHoldWaitResponse);

  // Give gives back the outside hold holder has on the repository's release slot. The reply says whether that freed the
  // slot. A give by a label that holds nothing frees nothing and is not an error.
  rpc Give(ReleaseSlotsGiveRequest) returns (ReleaseSlotsGiveResponse);

  // Show reports the holder of the repository's release slot, and whether the slot is held. A free slot names no holder.
  rpc Show(ReleaseSlotsShowRequest) returns (ReleaseSlotsShowResponse);
}

// ReleaseSlotHolder is the holder of a release slot: an epic, or an outside label with a deadline.
message ReleaseSlotHolder {
  // The holder's kind: "epic" for an epic that holds the slot, or "outside" for a label outside an epic.
  string kind = 1;

  // The epic's id, set when the kind is "epic".
  string epic = 2;

  // The outside label that holds the slot, set when the kind is "outside". It is the holder a Hold named.
  string label = 3;

  // The unix seconds the outside hold ends at, set when the kind is "outside". It is 0 for an epic holder.
  int64 deadline = 4;
}

// ReleaseSlotsHoldRequest asks for the release slot of a repository to be held for a label.
message ReleaseSlotsHoldRequest {
  // The absolute path of the repository whose release slot is held.
  string repository = 1;

  // The label that holds the slot. It is the outside label, and must not be empty.
  string holder = 2;

  // How many seconds the hold lasts from now. Must be at least 1 and at most 7200.
  int64 limit_seconds = 3;
}

// ReleaseSlotsHoldResponse is the reply to a Hold.
message ReleaseSlotsHoldResponse {
  // Whether the holder named in the request holds the slot.
  bool held = 1;

  // The holder of the slot: the requested label when held, otherwise the holder that keeps the slot.
  ReleaseSlotHolder holder = 2;
}

// ReleaseSlotsHoldWaitRequest asks for the release slot of a repository to be held for a label, and streams the wait.
message ReleaseSlotsHoldWaitRequest {
  // The absolute path of the repository whose release slot is held.
  string repository = 1;

  // The label that holds the slot. It is the outside label, and must not be empty.
  string holder = 2;

  // How many seconds the hold lasts from the moment it is taken. Must be at least 1 and at most 7200.
  int64 limit_seconds = 3;
}

// ReleaseSlotsHoldWaitResponse is one event in a HoldWait: the slot is held by another holder, or it is held for the
// requested label.
message ReleaseSlotsHoldWaitResponse {
  oneof event {
    // Another holder keeps the slot. The stream waits for it to be freed, and sends this event each time it is still held.
    ReleaseSlotHolder waiting = 1;

    // The requested label holds the slot. The stream closes after this event.
    ReleaseSlotHolder held = 2;
  }
}

// ReleaseSlotsGiveRequest asks for the outside hold of a label on a repository's release slot to be given back.
message ReleaseSlotsGiveRequest {
  // The absolute path of the repository whose release slot is given back.
  string repository = 1;

  // The label whose outside hold is given back. It must not be empty.
  string holder = 2;
}

// ReleaseSlotsGiveResponse is the reply to a Give.
message ReleaseSlotsGiveResponse {
  // Whether the give freed the slot. It is false when the label did not hold the slot.
  bool freed = 1;
}

// ReleaseSlotsShowRequest asks for the holder of a repository's release slot.
message ReleaseSlotsShowRequest {
  // The absolute path of the repository whose release slot is shown.
  string repository = 1;
}

// ReleaseSlotsShowResponse is the reply to a Show.
message ReleaseSlotsShowResponse {
  // Whether the slot is held.
  bool held = 1;

  // The holder of the slot. It is unset when the slot is free.
  ReleaseSlotHolder holder = 2;
}
