syntax = "proto3";

package orrery.engine.v1;

// Epics stores and reads accepted epic contracts. orreryd serves it on the same private socket as Steps.
service Epics {
  // CreateEpic stores an accepted contract with its seed decisions and returns the stored epic.
  rpc CreateEpic(CreateEpicRequest) returns (CreateEpicResponse);

  // GetEpic returns one stored epic by its id.
  rpc GetEpic(GetEpicRequest) returns (GetEpicResponse);

  // ListEpics returns a summary of every stored epic.
  rpc ListEpics(ListEpicsRequest) returns (ListEpicsResponse);

  // AnswerEpic records the owner's answer to a stored epic and returns the decision.
  rpc AnswerEpic(AnswerEpicRequest) returns (AnswerEpicResponse);

  // PauseEpic pauses a stored epic, so the planner starts no turn for it, and returns the stored epic.
  rpc PauseEpic(PauseEpicRequest) returns (PauseEpicResponse);

  // ResumeEpic clears the pause of a stored epic and returns the stored epic.
  rpc ResumeEpic(ResumeEpicRequest) returns (ResumeEpicResponse);

  // StopEpic pauses a stored epic, stops the step of its running turn, and returns the stored epic.
  rpc StopEpic(StopEpicRequest) returns (StopEpicResponse);

  // RetryEpic ends the park of a stored epic, so the planner starts its turns again, and returns the stored epic.
  rpc RetryEpic(RetryEpicRequest) returns (RetryEpicResponse);
}

// Evidence runs an item's evidence, lists an epic's evidence runs and reads the artifacts a run kept.
service Evidence {
  // RunEvidence runs an item's evidence at a revision for one phase and returns the run.
  rpc RunEvidence(RunEvidenceRequest) returns (RunEvidenceResponse);

  // ListEvidence returns the evidence runs an epic holds.
  rpc ListEvidence(ListEvidenceRequest) returns (ListEvidenceResponse);

  // GetEvidenceArtifact returns one artifact of a run, or the run's log when the name is empty.
  rpc GetEvidenceArtifact(GetEvidenceArtifactRequest) returns (GetEvidenceArtifactResponse);
}

// EpicContract is the ten sections of an accepted epic contract.
message EpicContract {
  // The epic's id, "<repo-id>/<epic-slug>", as the caller names it.
  string id = 1;

  // The absolute path of the git repository the epic belongs to.
  string repository = 2;

  // The epic's name.
  string title = 3;

  // The sentence of the decision line that approved the contract.
  string approved = 4;

  // What the owner asked for.
  string intent = 5;

  // What could go wrong, each failure with its level of care.
  repeated EpicFailure failures = 6;

  // The level of care the epic is worked at: limited, serious or severe.
  string care = 7;

  // Things the epic adds that the owner did not ask for.
  repeated EpicAddition additions = 8;

  // What will be true when the epic is done, each checked by a check or a review.
  repeated EpicRequirement requirements = 9;

  // What the contract assumes, each with what changes if the assumption is wrong.
  repeated EpicPremise premises = 10;

  // What the epic will not do.
  repeated string exclusions = 11;

  // How the epic will be done.
  string approach = 12;

  // The approaches considered and why each was not chosen.
  repeated EpicAlternative alternatives = 13;

  // What leaves this machine when the epic is released, each step with how it is undone.
  repeated EpicReleaseStep release_steps = 14;

  // The Then line that closes the release.
  string release_then = 15;

  // The checks the machines run.
  string checks = 16;

  // The commit the epic starts from, stored as the full commit id.
  string base = 17;

  // The epic's gates, each a command the checks run or an agent that reviews the epic.
  repeated EpicGate gates = 18;

  // The names of the command gates that show the epic is done.
  repeated string done_gates = 19;

  // The names of the agent gates that review the epic.
  repeated string review_gates = 20;
}

// EpicFailure is one failure the epic guards against.
message EpicFailure {
  // The failure's id, F<n>.
  string id = 1;

  // What could go wrong.
  string text = 2;

  // The failure's level of care: limited, serious or severe.
  string rating = 3;

  // What the epic does about the failure.
  string response = 4;
}

// EpicAddition is one thing the epic adds that the owner did not ask for.
message EpicAddition {
  // Where the addition applies, as the contract names it.
  string location = 1;

  // What the addition is.
  string what = 2;

  // Why the epic needs the addition.
  string why = 3;

  // What the addition costs.
  string cost = 4;
}

// EpicRequirement is one requirement: a thing that will be true when the epic is done.
message EpicRequirement {
  // The requirement's id, R<n>.
  string id = 1;

  // What will be true when the epic is done.
  string text = 2;

  // The check or review that shows the requirement is true. Kept for epics stored before O3d2; a new epic leaves it
  // empty.
  string evidence = 3;

  // How the requirement is shown: check or review. Kept for epics stored before O3d2; a new epic leaves it empty.
  string kind = 4;

  // The evidence that shows the requirement is true. Empty for epics stored before O3d2, which keep evidence and kind.
  EvidenceItem item = 5;
}

// EpicGateNeed is one pool a gate needs and how many of the pool's slots the gate takes.
message EpicGateNeed {
  // The pool's name.
  string pool = 1;

  // How many of the pool's slots the gate takes.
  int64 count = 2;
}

// EpicGate is one gate the epic's checks run: a command, or an agent that reviews the epic.
message EpicGate {
  // The gate's name, unique among the epic's gates.
  string name = 1;

  // The command the gate runs, the program first; empty for an agent gate.
  repeated string argv = 2;

  // The gate's time limit in seconds.
  int64 limit = 3;

  // The pools the gate needs while it runs.
  repeated EpicGateNeed needs = 4;

  // The agent that reviews the epic; empty for a command gate.
  string agent = 5;

  // The statements the agent's return must show hold.
  repeated string must = 6;

  // The statements the agent's return must show do not hold.
  repeated string must_not = 7;
}

// EvidenceItem is how a requirement or task shows its evidence: a capture a gate runs, or files the agent supplied.
message EvidenceItem {
  // The command the capture runs, the program first; empty when the evidence is supplied.
  repeated string capture = 1;

  // The capture's time limit in seconds; 0 when there is no capture.
  int64 limit = 2;

  // The repository-relative paths the capture keeps; empty when there is no capture.
  repeated string artifacts = 3;

  // The repository-relative files the agent supplied, read from the commit; empty when the evidence is captured.
  repeated string supplied = 4;

  // The conclusion the judge checks the evidence against.
  string conclusion = 5;

  // The agent that judges the evidence.
  string judge = 6;
}

// EvidenceArtifact is one file an evidence run kept, with the state it was kept in.
message EvidenceArtifact {
  // The artifact's repository-relative path.
  string path = 1;

  // The artifact's state: kept, missing or over_cap.
  string state = 2;

  // The sha256 of the stored blob; empty unless the artifact is kept.
  string hash = 3;

  // The artifact's size in bytes.
  int64 size = 4;
}

// EvidenceRun is one evidence run: an item's evidence captured or supplied for one phase at a revision, with its
// verdict.
message EvidenceRun {
  // The run's id.
  string id = 1;

  // The epic the run belongs to.
  string epic = 2;

  // The requirement or task whose evidence the run shows.
  string item = 3;

  // The commit the run captured or read at.
  string revision = 4;

  // The phase the run is for: red or green.
  string phase = 5;

  // How the evidence was produced: captured or supplied.
  string source = 6;

  // The run's state: capturing, judging or ended.
  string state = 7;

  // The capture's exit code; for a supplied run, 0 when every file is kept and 1 otherwise.
  int32 exit = 8;

  // Whether the capture was killed at its time limit.
  bool timed_out = 9;

  // Why the capture has no result: could not start, killed at its limit, or lost at a restart. Empty otherwise.
  string not_captured = 10;

  // The sha256 of the run's log; empty until the log is stored.
  string log_hash = 11;

  // The size of the run's log in bytes.
  int64 log_bytes = 12;

  // The artifacts the run kept, each with the state it was kept in.
  repeated EvidenceArtifact artifacts = 13;

  // The id of the judge's step; empty until the run is judged.
  string judge_step = 14;

  // The judge's verdict: holds, fails, or empty when the judge gave none.
  string verdict = 15;

  // Why the judge gave no verdict. Empty otherwise.
  string judge_reason = 16;

  // Whether the run passes its phase: red when the conclusion fails; green when it holds and the capture exited 0.
  bool passed = 17;

  // When the run was created, in unix seconds.
  int64 created = 18;

  // When the run ended, in unix seconds; 0 while it runs.
  int64 ended = 19;
}

// EpicPremise is one assumption the contract makes.
message EpicPremise {
  // The premise's id, P<n>.
  string id = 1;

  // The assumption.
  string text = 2;

  // What changes if the assumption is wrong.
  string if_wrong = 3;
}

// EpicAlternative is one approach considered and not chosen.
message EpicAlternative {
  // The approach.
  string alternative = 1;

  // Why the approach was not chosen.
  string why_not = 2;

  // What would make the owner reconsider the approach.
  string reconsider = 3;
}

// EpicReleaseStep is one step that leaves this machine on release.
message EpicReleaseStep {
  // What the step does.
  string step = 1;

  // Where the step sends what leaves the machine.
  string target = 2;

  // How the step is undone.
  string undo = 3;
}

// EpicDecisionInput is a decision the owner made before the contract was created.
message EpicDecisionInput {
  // The decision's id, unique among the epic's decisions.
  string id = 1;

  // The decision's text.
  string text = 2;
}

// EpicDecision is one decision recorded on an epic, in the order it was recorded.
message EpicDecision {
  // The decision's position on the epic, counted from 1.
  int64 seq = 1;

  // The decision's id.
  string id = 2;

  // The decision's text.
  string text = 3;

  // When the decision was recorded, in unix seconds.
  int64 time = 4;

  // The question, Q<n>, the decision answers; empty for a note.
  string question = 5;
}

// EpicTurn is one planner turn on an epic, in the order it started.
message EpicTurn {
  // The turn's position on the epic, counted from 1.
  int64 seq = 1;

  // The step the turn runs, empty until the turn has one.
  string step = 2;

  // The turn's state: running, succeeded, failed or free.
  string state = 3;

  // Why the turn failed or was freed, empty otherwise.
  string reason = 4;

  // The outline the turn's return gave, empty until the turn succeeds.
  string outline = 5;

  // The outcome the turn's return gave, empty until the turn succeeds.
  string outcome = 6;

  // The decisions the turn's return recorded, in the order they were recorded.
  repeated string decisions = 7;

  // When the turn started, in unix seconds.
  int64 started = 8;

  // When the turn ended, in unix seconds; 0 while the turn runs.
  int64 ended = 9;
}

// EpicTask is one task a planner turn planned.
message EpicTask {
  // The task's id, T<seq>.
  string id = 1;

  // The position of the turn that planned the task, counted from 1.
  int64 turn = 2;

  // The task's title.
  string title = 3;

  // What the task delivers.
  string deliverable = 4;

  // The files the task touches.
  repeated string files = 5;

  // The requirements the task covers.
  repeated string requirements = 6;

  // The check that shows the task is done. Empty since O3d2: the task's evidence conclusion carries the check.
  string check = 7;

  // The task's status: open until it is done.
  string status = 8;

  // The name of the command gate the task's check runs, from the epic's gates.
  string gate = 9;

  // The evidence that shows the task is done.
  EvidenceItem evidence = 10;
}

// EpicQuestion is one question a planner turn asked.
message EpicQuestion {
  // The question's id, Q<seq>.
  string id = 1;

  // The position of the turn that asked the question, counted from 1.
  int64 turn = 2;

  // The question.
  string text = 3;

  // The question's state: open until the owner answers it.
  string state = 4;
}

// StoredEpic is a stored epic with its contract, phase, times, decisions and planner state.
message StoredEpic {
  // The epic's contract as created.
  EpicContract contract = 1;

  // The epic's phase, accepted when it is created.
  string phase = 2;

  // When the epic was created, in unix seconds.
  int64 created = 3;

  // When the epic last changed, in unix seconds.
  int64 changed = 4;

  // The epic's decisions in the order they were recorded.
  repeated EpicDecision decisions = 5;

  // Whether the epic is paused. A paused epic starts no planner turn until it is resumed.
  bool paused = 6;

  // Why the epic is parked, empty when it is not parked. A parked epic starts no planner turn.
  string parked = 7;

  // The epic's planner turns in the order they started.
  repeated EpicTurn turns = 8;

  // The tasks the epic's planner turns planned, in the order they were planned.
  repeated EpicTask tasks = 9;

  // The questions the epic's planner turns asked, in the order they were asked.
  repeated EpicQuestion questions = 10;
}

// EpicSummary is an epic's head fields, without its contract.
message EpicSummary {
  // The epic's id, "<repo-id>/<epic-slug>".
  string id = 1;

  // The absolute path of the git repository the epic belongs to.
  string repository = 2;

  // The epic's name.
  string title = 3;

  // The epic's phase.
  string phase = 4;

  // When the epic was created, in unix seconds.
  int64 created = 5;

  // When the epic last changed, in unix seconds.
  int64 changed = 6;
}

// CreateEpicRequest asks for a new epic.
message CreateEpicRequest {
  // The contract to store.
  EpicContract contract = 1;

  // The seed decisions, recorded in order as the epic's first decisions.
  repeated EpicDecisionInput decisions = 2;
}

// CreateEpicResponse carries the stored epic.
message CreateEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// GetEpicRequest names one epic.
message GetEpicRequest {
  // The epic's id.
  string id = 1;
}

// GetEpicResponse carries one stored epic.
message GetEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// ListEpicsRequest asks for every stored epic. It has no fields.
message ListEpicsRequest {}

// ListEpicsResponse carries the summary of every stored epic.
message ListEpicsResponse {
  // The summaries of the stored epics.
  repeated EpicSummary epics = 1;
}

// AnswerEpicRequest records the owner's answer to one epic.
message AnswerEpicRequest {
  // The id of the epic the answer belongs to.
  string epic_id = 1;

  // The decision's id.
  string id = 2;

  // The owner's answer.
  string text = 3;

  // The question, Q<n>, the answer names; empty for a note.
  string question = 4;
}

// AnswerEpicResponse carries the recorded decision.
message AnswerEpicResponse {
  // The decision recorded, or the stored decision with the same text.
  EpicDecision decision = 1;

  // A warning set when a note is recorded while questions are open; empty otherwise.
  string warning = 2;
}

// PauseEpicRequest names the epic to pause.
message PauseEpicRequest {
  // The epic's id.
  string id = 1;
}

// PauseEpicResponse carries the paused epic.
message PauseEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// ResumeEpicRequest names the epic to resume.
message ResumeEpicRequest {
  // The epic's id.
  string id = 1;
}

// ResumeEpicResponse carries the resumed epic.
message ResumeEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// StopEpicRequest names the epic to stop.
message StopEpicRequest {
  // The epic's id.
  string id = 1;
}

// StopEpicResponse carries the stopped epic.
message StopEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// RetryEpicRequest names the epic to retry.
message RetryEpicRequest {
  // The epic's id.
  string id = 1;
}

// RetryEpicResponse carries the retried epic.
message RetryEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// RunEvidenceRequest asks for one item's evidence to run at a revision for one phase.
message RunEvidenceRequest {
  // The id of the epic the item belongs to.
  string epic = 1;

  // The requirement or task the evidence shows.
  string item = 2;

  // The commit the evidence runs at.
  string revision = 3;

  // The phase the run is for: red or green.
  string phase = 4;
}

// RunEvidenceResponse carries the evidence run.
message RunEvidenceResponse {
  // The evidence run.
  EvidenceRun run = 1;
}

// ListEvidenceRequest asks for the evidence runs an epic holds.
message ListEvidenceRequest {
  // The epic's id.
  string epic = 1;
}

// ListEvidenceResponse carries the evidence runs an epic holds.
message ListEvidenceResponse {
  // The epic's evidence runs.
  repeated EvidenceRun runs = 1;
}

// GetEvidenceArtifactRequest names one artifact of an evidence run.
message GetEvidenceArtifactRequest {
  // The evidence run's id.
  string run = 1;

  // The artifact's repository-relative path; empty for the run's log.
  string name = 2;
}

// GetEvidenceArtifactResponse carries one artifact's bytes.
message GetEvidenceArtifactResponse {
  // The artifact's bytes, or the run's log's bytes.
  bytes data = 1;

  // The sha256 of the bytes.
  string hash = 2;
}
