syntax = "proto3";

package orrery.engine.v1;

// Epics stores and reads accepted epic contracts. orreryd serves it on the same private socket as Steps.
service Epics {
  // CreateEpic stores an accepted contract with its seed decisions and returns the stored epic.
  rpc CreateEpic(CreateEpicRequest) returns (CreateEpicResponse);

  // GetEpic returns one stored epic by its id.
  rpc GetEpic(GetEpicRequest) returns (GetEpicResponse);

  // ListEpics returns a summary of every stored epic.
  rpc ListEpics(ListEpicsRequest) returns (ListEpicsResponse);

  // AnswerEpic records the owner's answer to a stored epic and returns the decision.
  rpc AnswerEpic(AnswerEpicRequest) returns (AnswerEpicResponse);

  // PauseEpic pauses a stored epic, so the planner starts no turn for it, and returns the stored epic.
  rpc PauseEpic(PauseEpicRequest) returns (PauseEpicResponse);

  // ResumeEpic clears the pause of a stored epic and returns the stored epic.
  rpc ResumeEpic(ResumeEpicRequest) returns (ResumeEpicResponse);

  // StopEpic pauses a stored epic, stops the step of its running turn, and returns the stored epic.
  rpc StopEpic(StopEpicRequest) returns (StopEpicResponse);

  // RetryEpic ends the park of a stored epic, so the planner starts its turns again, and returns the stored epic.
  rpc RetryEpic(RetryEpicRequest) returns (RetryEpicResponse);

  // KickEpic records the owner's text on a stored epic as a decision and wakes its planner with it at the epic's next
  // plan run, and returns the stored epic.
  rpc KickEpic(KickEpicRequest) returns (KickEpicResponse);

  // FollowEpics returns, per label, how many answered questions had a recommendation and how many took it.
  rpc FollowEpics(FollowEpicsRequest) returns (FollowEpicsResponse);

  // ReleaseEpic releases a stored epic. It resumes the stopped release at its first unfinished step, running again the
  // undo-none release steps it names. An epic that ended with gaps is released on the owner's word, logged as the
  // owner's decision, and names no undo-none step. It returns the stored epic.
  rpc ReleaseEpic(ReleaseEpicRequest) returns (ReleaseEpicResponse);

  // CloseEpic closes a stored epic as superseded, shipped by hand or abandoned. It ends the epic's running turn and stops
  // its running steps, answers its open questions and frees its release slot, and returns the stored epic. A close by the
  // planner routes the ending report to the owner. It refuses superseded without the epic that replaces it.
  rpc CloseEpic(CloseEpicRequest) returns (CloseEpicResponse);

  // AmendEvidence asks for a Requirement of a stored epic to hold a new evidence item, which must pass the shape check a
  // created epic's items pass. The amendment starts checking: the item replaces the Requirement's own only once a red run
  // of it at the epic's base is judged not to hold there, and a red that holds refuses it. It returns the stored
  // amendment and the stored epic. A call from the step of the epic's running turn amends as the planner, which may not
  // change the conclusion; any other call amends as the owner, who may.
  rpc AmendEvidence(AmendEvidenceRequest) returns (AmendEvidenceResponse);

  // SeeEpic records that the owner saw the stored epic, so its seen mark is the time of this call.
  rpc SeeEpic(SeeEpicRequest) returns (SeeEpicResponse);

  // ArchiveRow marks the list row of kind and id archived, at the time of the call, and answers an empty reply. kind is
  // epic, session or headless. A row needs no table of its own: an epic with only a record is archived by its id.
  rpc ArchiveRow(ArchiveRowRequest) returns (ArchiveRowResponse);

  // UnarchiveRow clears the archive mark of the list row of kind and id, and answers an empty reply. The refusals are
  // those of ArchiveRow.
  rpc UnarchiveRow(UnarchiveRowRequest) returns (UnarchiveRowResponse);

  // MoveEpic moves a stored epic's steering to the session the request names, or to the calling conversation when the
  // session is empty, and returns the stored epic.
  rpc MoveEpic(MoveEpicRequest) returns (MoveEpicResponse);

  // ContinueEpic starts a steering session for a stored epic, moves the epic's steering to it as its owner, and returns
  // the stored epic with the session's id.
  rpc ContinueEpic(ContinueEpicRequest) returns (ContinueEpicResponse);
}

// Evidence runs an item's evidence, lists an epic's evidence runs and reads the artifacts a run kept.
service Evidence {
  // RunEvidence runs an item's evidence at a revision for one phase and returns the run.
  rpc RunEvidence(RunEvidenceRequest) returns (RunEvidenceResponse);

  // ListEvidence returns the evidence runs an epic holds.
  rpc ListEvidence(ListEvidenceRequest) returns (ListEvidenceResponse);

  // GetEvidenceArtifact returns one artifact of a run, or the run's log when the name is empty.
  rpc GetEvidenceArtifact(GetEvidenceArtifactRequest) returns (GetEvidenceArtifactResponse);
}

// EpicContract is the ten sections of an accepted epic contract.
message EpicContract {
  // The epic's id, "<repo-id>/<epic-slug>", as the caller names it.
  string id = 1;

  // The absolute path of the git repository the epic belongs to.
  string repository = 2;

  // The epic's name.
  string title = 3;

  // The sentence of the decision line that approved the contract.
  string approved = 4;

  // What the owner asked for.
  string intent = 5;

  // What could go wrong, each failure with its level of care.
  repeated EpicFailure failures = 6;

  // The level of care the epic is worked at: limited, serious or severe.
  string care = 7;

  // Things the epic adds that the owner did not ask for.
  repeated EpicAddition additions = 8;

  // What will be true when the epic is done, each checked by a check or a review.
  repeated EpicRequirement requirements = 9;

  // What the contract assumes, each with what changes if the assumption is wrong.
  repeated EpicPremise premises = 10;

  // What the epic will not do.
  repeated string exclusions = 11;

  // How the epic will be done.
  string approach = 12;

  // The approaches considered and why each was not chosen.
  repeated EpicAlternative alternatives = 13;

  // What leaves this machine when the epic is released, each step with how it is undone.
  repeated EpicReleaseStep release_steps = 14;

  // The Then line that closes the release.
  string release_then = 15;

  // The checks the machines run.
  string checks = 16;

  // The commit the epic starts from, stored as the full commit id.
  string base = 17;

  // The epic's gates, each a command the checks run or an agent that reviews the epic.
  repeated EpicGate gates = 18;

  // The names of the command gates that show the epic is done.
  repeated string done_gates = 19;

  // Refused when set: the epic's reviewers fill its per-task review list. Kept so old requests still decode.
  repeated string review_gates = 20;

  // The reviewers the epic declares. Each merges by name over orrery's defaults and the project file.
  repeated EpicReviewer reviewers = 21;
}

// EpicFailure is one failure the epic guards against.
message EpicFailure {
  // The failure's id, F<n>.
  string id = 1;

  // What could go wrong.
  string text = 2;

  // The failure's level of care: limited, serious or severe.
  string rating = 3;

  // What the epic does about the failure.
  string response = 4;
}

// EpicAddition is one thing the epic adds that the owner did not ask for.
message EpicAddition {
  // Where the addition applies, as the contract names it.
  string location = 1;

  // What the addition is.
  string what = 2;

  // Why the epic needs the addition.
  string why = 3;

  // What the addition costs.
  string cost = 4;
}

// EpicReviewer is one reviewer. In the contract it is the epic's layer: an optional key left unset keeps the value the
// layer below sets, and an empty repeated field is unset. In the stored epic it is a merged reviewer.
message EpicReviewer {
  // The reviewer's name: lowercase letters, digits and underscores, starting with a letter, at most 48 bytes.
  string name = 1;

  // Whether the reviewer runs. A disabled reviewer stays in the list and runs at no stage.
  optional bool enabled = 2;

  // The stages the reviewer runs at: any of task, epic and release. The release stage runs once before the release's
  // first step, on the candidate.
  repeated string stage = 3;

  // The statements the reviewer's return must show hold.
  repeated string must = 4;

  // The statements the reviewer's return must show do not hold.
  repeated string must_not = 5;

  // The role the reviewer runs under. Required when model is set.
  optional string prompt = 6;

  // The agent the reviewer runs, an agent claude already has. Set beside neither model, tools nor effort.
  optional string agent = 7;

  // The model the reviewer runs on, under an inline agent named from the reviewer. Never set beside agent.
  optional string model = 8;

  // The tools the reviewer may use. Never set beside agent.
  repeated string tools = 9;

  // The effort the reviewer runs at: low, medium, high, xhigh or max. Never set beside agent.
  optional string effort = 10;

  // The reviewer's time limit in seconds.
  optional int64 limit = 11;

  // Whether the reviewer's findings go to a verifier. Off, each finding counts as confirmed and is marked unverified.
  optional bool verify = 12;
}

// EpicRequirement is one requirement: a thing that will be true when the epic is done.
message EpicRequirement {
  // The requirement's id, R<n>.
  string id = 1;

  // What will be true when the epic is done.
  string text = 2;

  // The check or review that shows the requirement is true. Kept for epics stored before O3d2; a new epic leaves it
  // empty.
  string evidence = 3;

  // How the requirement is shown: check or review. Kept for epics stored before O3d2; a new epic leaves it empty.
  string kind = 4;

  // The evidence that shows the requirement is true. Empty for epics stored before O3d2, which keep evidence and kind.
  EvidenceItem item = 5;

  // The id of the task not failed that claims the requirement, T<seq>; empty when no task claims it.
  string owner = 6;

  // The ids of the tasks not failed that contribute to the requirement, T<seq>, in seq order.
  repeated string contributors = 7;

  // How far the requirement is shown: pending, red or green, from the runs of its current item.
  string state = 8;

  // The judge and exit disagreement at built: red was judged fails at the epic's base, but its reproduction with the
  // candidate's tests exited 0; empty when they agree.
  string disagreement = 9;
}

// EpicGateNeed is one pool a gate needs and how many of the pool's slots the gate takes.
message EpicGateNeed {
  // The pool's name.
  string pool = 1;

  // How many of the pool's slots the gate takes.
  int64 count = 2;
}

// EpicGate is one gate the epic's checks run: a command, or an agent that reviews the epic.
message EpicGate {
  // The gate's name, unique among the epic's gates.
  string name = 1;

  // The command the gate runs, the program first; empty for an agent gate.
  repeated string argv = 2;

  // The gate's time limit in seconds.
  int64 limit = 3;

  // The pools the gate needs while it runs.
  repeated EpicGateNeed needs = 4;

  // The agent that reviews the epic; empty for a command gate.
  string agent = 5;

  // The statements the agent's return must show hold.
  repeated string must = 6;

  // The statements the agent's return must show do not hold.
  repeated string must_not = 7;
}

// EvidenceItem is how a requirement or task shows its evidence: a capture a gate runs, or files the agent supplied.
message EvidenceItem {
  // The command the capture runs, the program first; empty when the evidence is supplied.
  repeated string capture = 1;

  // The capture's time limit in seconds; 0 when there is no capture.
  int64 limit = 2;

  // The repository-relative paths the capture keeps; empty when there is no capture.
  repeated string artifacts = 3;

  // The repository-relative files the agent supplied, read from the commit; empty when the evidence is captured.
  repeated string supplied = 4;

  // The conclusion the judge checks the evidence against.
  string conclusion = 5;

  // The agent that judges the evidence.
  string judge = 6;

  // How the evidence shows the requirement or task is done: test, capture or supplied; empty for an item stored without
  // a kind.
  string kind = 7;

  // The repository-relative test files a test item runs beside its capture; empty for an item that is not a test.
  repeated string tests = 8;
}

// EvidenceArtifact is one file an evidence run kept, with the state it was kept in.
message EvidenceArtifact {
  // The artifact's repository-relative path.
  string path = 1;

  // The artifact's state: kept, missing or over_cap.
  string state = 2;

  // The sha256 of the stored blob; empty unless the artifact is kept.
  string hash = 3;

  // The artifact's size in bytes.
  int64 size = 4;
}

// EvidenceRun is one evidence run: an item's evidence captured or supplied for one phase at a revision, with its
// verdict.
message EvidenceRun {
  // The run's id.
  string id = 1;

  // The epic the run belongs to.
  string epic = 2;

  // The requirement or task whose evidence the run shows.
  string item = 3;

  // The commit the run captured or read at.
  string revision = 4;

  // The phase the run is for: red or green.
  string phase = 5;

  // How the evidence was produced: captured or supplied.
  string source = 6;

  // The run's state: capturing, judging or ended.
  string state = 7;

  // The capture's exit code; for a supplied run, 0 when every file is kept and 1 otherwise.
  int32 exit = 8;

  // Whether the capture was killed at its time limit.
  bool timed_out = 9;

  // Why the capture has no result: could not start, killed at its limit, or lost at a restart. Empty otherwise.
  string not_captured = 10;

  // The sha256 of the run's stdout log; empty until the log is stored.
  string log_hash = 11;

  // The size of the run's stdout log in bytes.
  int64 log_bytes = 12;

  // The artifacts the run kept, each with the state it was kept in.
  repeated EvidenceArtifact artifacts = 13;

  // The id of the judge's step; empty until the run is judged.
  string judge_step = 14;

  // The judge's verdict: holds, fails, or empty when the judge gave none.
  string verdict = 15;

  // Why the judge gave no verdict. Empty otherwise.
  string judge_reason = 16;

  // Whether the run passes its phase: red when the conclusion fails; green when it holds and the capture exited 0.
  bool passed = 17;

  // When the run was created, in unix seconds.
  int64 created = 18;

  // When the run ended, in unix seconds; 0 while it runs.
  int64 ended = 19;

  // The sha256 of the run's stderr log; empty until the log is stored.
  string stderr_hash = 20;

  // The size of the run's stderr log in bytes.
  int64 stderr_bytes = 21;
}

// EpicPremise is one assumption the contract makes.
message EpicPremise {
  // The premise's id, P<n>.
  string id = 1;

  // The assumption.
  string text = 2;

  // What changes if the assumption is wrong.
  string if_wrong = 3;
}

// EpicAlternative is one approach considered and not chosen.
message EpicAlternative {
  // The approach.
  string alternative = 1;

  // Why the approach was not chosen.
  string why_not = 2;

  // What would make the owner reconsider the approach.
  string reconsider = 3;
}

// EpicReleaseStep is one step that leaves this machine on release.
message EpicReleaseStep {
  // What the step does.
  string step = 1;

  // Where the step sends what leaves the machine.
  string target = 2;

  // How the step is undone.
  string undo = 3;
}

// EpicDecisionInput is a decision the owner made before the contract was created.
message EpicDecisionInput {
  // The decision's id, unique among the epic's decisions.
  string id = 1;

  // The decision's text.
  string text = 2;
}

// EpicDecision is one decision recorded on an epic, in the order it was recorded.
message EpicDecision {
  // The decision's position on the epic, counted from 1.
  int64 seq = 1;

  // The decision's id.
  string id = 2;

  // The decision's text.
  string text = 3;

  // When the decision was recorded, in unix seconds.
  int64 time = 4;

  // The question, Q<n>, the decision answers; empty for a note.
  string question = 5;

  // Who recorded the decision: 'owner', 'conversation' or 'orreryd'; empty for a decision stored before this release.
  string by = 6;

  // The conversation's session id when by is 'conversation', empty otherwise.
  string session = 7;
}

// EpicTurn is one planner turn on an epic, in the order it started.
message EpicTurn {
  // The turn's position on the epic, counted from 1.
  int64 seq = 1;

  // The step the turn runs, empty until the turn has one.
  string step = 2;

  // The turn's state: running, succeeded, failed or free.
  string state = 3;

  // Why the turn failed or was freed, empty otherwise.
  string reason = 4;

  // The outline the turn's return gave, empty until the turn succeeds.
  string outline = 5;

  // The outcome the turn's return gave, empty until the turn succeeds.
  string outcome = 6;

  // The decisions the turn's return recorded, in the order they were recorded.
  repeated string decisions = 7;

  // When the turn started, in unix seconds.
  int64 started = 8;

  // When the turn ended, in unix seconds; 0 while the turn runs.
  int64 ended = 9;
}

// EpicTask is one task a planner turn planned.
message EpicTask {
  // The task's id, T<seq>.
  string id = 1;

  // The position of the turn that planned the task, counted from 1.
  int64 turn = 2;

  // The task's title.
  string title = 3;

  // What the task delivers.
  string deliverable = 4;

  // The files the task touches.
  repeated string files = 5;

  // The requirements the task covers.
  repeated string requirements = 6;

  // The check that shows the task is done. Empty since O3d2: the task's evidence conclusion carries the check.
  string check = 7;

  // The task's status: open until it is done.
  string status = 8;

  // The name of the command gate the task's check runs, from the epic's gates.
  string gate = 9;

  // The evidence that shows the task is done.
  EvidenceItem evidence = 10;

  // The stage the task's build is on: empty before its first unit, then red, implement, green, review or verify.
  string stage = 11;

  // The attempt the task's build is on; 0 before the build's first attempt starts.
  int64 attempt = 12;

  // The step of the build's current unit, empty when the unit has no step.
  string step = 13;

  // The revision the task builds from, empty before the build starts.
  string base = 14;

  // The revision the build's current unit runs at, empty when the unit runs none.
  string revision = 15;

  // The reason the build's last failed unit gave, empty when no unit failed.
  string failure = 16;

  // Whether the task's review gates ran: unreviewed when the task was accepted with none, reviewed when it was accepted
  // after them; empty until the task is accepted.
  string review = 17;

  // Why the build stopped: stopped or parked; empty while the build runs.
  string held = 18;

  // The red evidence run the build names; absent until the build names one.
  EvidenceRun red = 19;

  // The green evidence run the build names; absent until the build names one.
  EvidenceRun green = 20;

  // The reviews of the task's build, in attempt then position order.
  repeated EpicTaskReview reviews = 21;

  // The Requirement ids the task contributes to without claiming them, R<n>.
  repeated string contributes = 22;

  // The task's own test files it may change, each also one of its files; the guard lifts its rules for them, except a
  // skip in the task's own evidence test.
  repeated string test_changes = 23;

  // The guard's last refusal of the task's build, each refused file, test and rule; empty when the guard refused
  // nothing.
  string guard = 24;

  // The number of the task's current spec version: 1 for the planner's, and the number of the last applied version
  // once a stored version is applied.
  int64 version = 25;

  // Every stored version after the planner's, in version order, whatever its state.
  repeated EpicTaskVersion versions = 26;

  // The source of the task's current spec version: planner for version 1, and otherwise the source of its last applied
  // version.
  string source = 27;

  // The task's ladder rows in rung order, empty for a task that never climbed.
  repeated EpicTaskRung rungs = 28;
}

// EpicTaskVersion is one stored version of a task's spec after the planner's: the source and epic decision that wrote
// it, the fields it changes and its state. A field the version does not change is empty.
message EpicTaskVersion {
  // The version's number on its task, from 2.
  int64 version = 1;

  // The source that wrote the version: orchestrator, grant, approach, carry or send_back, or rescue for a version stored
  // before the rescue rung was removed.
  string source = 2;

  // The id of the epic decision that wrote the version; empty for orreryd's rule grant.
  string decision = 3;

  // The step that wrote the version.
  string step = 4;

  // The reason the version gives.
  string reason = 5;

  // The version's state: checking, applied or refused.
  string state = 6;

  // The names of the fields the version changes, in the order deliverable, files, test_changes, gate, evidence.
  repeated string changed = 7;

  // The deliverable the version sets; empty when it does not change the deliverable.
  string deliverable = 8;

  // The task's whole file list after the version; empty when the version does not change the files.
  repeated string files = 9;

  // The task's whole test_changes list after the version; empty when the version does not change them.
  repeated string test_changes = 10;

  // The gate the version sets; empty when it does not change the gate.
  string gate = 11;

  // The evidence the version sets; absent when the version does not change the evidence.
  EvidenceItem evidence = 12;

  // The red run the version names; empty until it names one.
  string red_run = 13;

  // Why the version was refused; empty unless it is refused.
  string refusal = 14;

  // When the version was stored, in unix seconds.
  int64 created = 15;

  // When the version left checking, in unix seconds; 0 while it is checking.
  int64 settled = 16;
}

// EpicTaskRung is one rung of a task's ladder: the task build's attempt it stands for, what moved the task onto it, and
// how it ended.
message EpicTaskRung {
  // The task build's attempt number, from 1; 6 is the gap.
  int64 rung = 1;

  // The rung's kind: attempt, orchestrator, approach or gap, or rescue for a rung stored before the rescue rung was
  // removed.
  string kind = 2;

  // What moved the task onto the rung: unit, finding, fail_decision, cannot_meet, fail_task or send_back; empty for
  // rung 1.
  string moved_by = 3;

  // The failure's text that moved the task onto the rung; empty for rung 1.
  string cause = 4;

  // The review gate of the confirmed finding that moved the task onto the rung; empty when no finding did.
  string gate = 5;

  // The claim of the confirmed finding that moved the task onto the rung; empty when no finding did.
  string assertion = 6;

  // The step the failure came from; empty for rung 1.
  string step = 7;

  // When the rung was written, in unix seconds.
  int64 created = 8;

  // How the rung ended: failed, accepted or gap; empty while the rung is open.
  string outcome = 9;

  // Why the rung ended; empty when no reason was given.
  string reason = 10;

  // When the rung ended, in unix seconds; 0 while it is open.
  int64 ended = 11;
}

// EpicTaskReview is one review of a task's build: its attempt, the gate it ran, its step, its verdict and its findings.
message EpicTaskReview {
  // The attempt the review ran in.
  int64 attempt = 1;

  // The review gate the review ran.
  string gate = 2;

  // The step that ran the review.
  string step = 3;

  // The review's verdict: holds, fails, or undetermined when the reviewer gave neither twice.
  string verdict = 4;

  // The findings the review raised, in position order.
  repeated EpicTaskFinding findings = 5;

  // Why the review is undetermined: how its step ended. Empty for holds and fails.
  string reason = 6;
}

// EpicTaskFinding is one finding a review raised, with its verification.
message EpicTaskFinding {
  // The finding's id.
  string id = 1;

  // The claim the finding makes.
  string claim = 2;

  // Where the finding is located.
  string location = 3;

  // The step that verified the finding; empty until it is verified.
  string step = 4;

  // The verification's result: confirmed, dropped or undecided; empty until it is verified.
  string result = 5;

  // Why the verification gave its result.
  string reason = 6;

  // Whether the finding was confirmed without a verifier: a review with verify off confirms its findings and marks
  // each one unverified.
  bool unverified = 7;
}

// EpicQuestion is one question a planner turn asked.
message EpicQuestion {
  // The question's id, Q<seq>.
  string id = 1;

  // The position of the turn that asked the question, counted from 1.
  int64 turn = 2;

  // The question.
  string text = 3;

  // The question's state: open until the owner answers it.
  string state = 4;

  // The label the question is filed under, kebab-case. Empty for a question stored before labels.
  string label = 5;

  // The choices the question declares. The owner may also answer with other, which every question offers.
  repeated EpicQuestionChoice choices = 6;

  // The choice the question recommends, with why and how sure the planner is. Unset when it recommends none.
  EpicRecommendation recommendation = 7;

  // The question this one replaces, Q<n>; empty when it replaces none.
  string replaces = 8;

  // The question that replaced this one, Q<n>; empty while it is not replaced.
  string replaced_by = 9;

  // The choice that answered the question: a declared choice's id, or other for the owner's words. Empty while the
  // question is open or replaced.
  string choice = 10;
}

// EpicQuestionChoice is one choice a planner question declares.
message EpicQuestionChoice {
  // The choice's id, the answer the owner gives to choose it.
  string id = 1;

  // What the choice does.
  string does = 2;
}

// EpicRecommendation is the choice a planner question recommends, why, and how sure the planner is of it.
message EpicRecommendation {
  // The recommended choice's id.
  string choice = 1;

  // Why the planner recommends the choice.
  string why = 2;

  // How sure the planner is: low, medium or high.
  string confidence = 3;
}

// EpicTrigger is one trigger of an epic, which starts or wakes its planner.
message EpicTrigger {
  // The trigger's id.
  string id = 1;

  // What the trigger is for, in words.
  string cause = 2;

  // The trigger's state: pending, claimed or consumed.
  string state = 3;

  // The position of the turn that claimed the trigger, counted from 1; 0 while the trigger is pending.
  int64 turn = 4;

  // When the trigger was created, in unix seconds.
  int64 created = 5;
}

// EpicTell is one tell an epic holds for its owner.
message EpicTell {
  // The tell's position on the epic, counted from 1.
  int64 seq = 1;

  // The tell's text.
  string text = 2;

  // When the tell was written, in unix seconds.
  int64 at = 3;

  // Whether the owner has been told it.
  bool told = 4;
}

// EpicWorkflow is the workflow an epic pins: its name, its canonical text and the sha256 of that text.
message EpicWorkflow {
  // The workflow's name.
  string name = 1;

  // The workflow's canonical text, as the epic pinned it.
  string text = 2;

  // The sha256 of text, in lowercase hex.
  string sha256 = 3;
}

// EpicNodeCheck is the check a gate or command node run ran: its state, how it ended, and its output.
message EpicNodeCheck {
  // The check's state: running until it ends, then ended.
  string state = 1;

  // The check's exit code once it ends.
  int32 exit = 2;

  // Whether the check was killed at its time limit.
  bool timed_out = 3;

  // Why the check did not run. Empty otherwise.
  string not_run = 4;

  // The check's stdout, its newest bytes.
  string stdout = 5;

  // The check's stderr, its newest bytes.
  string stderr = 6;
}

// EpicNode is one workflow node run on an epic: the node it runs, its state and outcome, and the rows its kind holds.
message EpicNode {
  // The run's path, unique on the epic.
  string path = 1;

  // The workflow node's id.
  string node = 2;

  // The node's kind, or loop for a loop.
  string kind = 3;

  // The run's state: running, ended or parked.
  string state = 4;

  // The run's outcome once it ends. Empty before.
  string outcome = 5;

  // The innermost enclosing loop's round, 0 outside a loop.
  int64 round = 6;

  // A loop's current round from 1, 0 for any other kind.
  int64 loop_round = 7;

  // The attempt the run runs at. A retry moves it on by one.
  int64 attempt = 8;

  // The output the run ended or parked with.
  string output = 9;

  // The revision the run's work ran at. Empty before the work is prepared.
  string revision = 10;

  // A plan's turn seqs above its mark, in order. Empty for any other kind.
  repeated int64 turns = 11;

  // A plan's task seqs of the turns above its mark, or a build's task seq. Empty for any other kind.
  repeated int64 tasks = 12;

  // An evidence node's evidence run ids for its attempt, in the Requirements' order. Empty for any other kind.
  repeated string runs = 13;

  // A gate or command node's check. Unset until the check is stored.
  EpicNodeCheck check = 14;

  // An agent node's step id. Unset until the step is stored.
  string step = 15;
}

// EpicLedger is an epic's end-of-epic review: the verdicts of its reviewers, the findings they returned, and the
// correction rounds that followed.
message EpicLedger {
  // The reviewers' verdicts, by position.
  repeated EpicReviewVerdict verdicts = 1;

  // The ledger's findings, by position.
  repeated EpicLedgerFinding findings = 2;

  // The correction rounds, by round.
  repeated EpicReviewRound rounds = 3;
}

// EpicReviewVerdict is one reviewer's verdict in the epic's review.
message EpicReviewVerdict {
  // The reviewer's 1-based place among the epic's enabled epic-stage reviewers.
  int64 position = 1;

  // The reviewer's name.
  string reviewer = 2;

  // The step that gave the verdict. For a gap, the last try's step.
  string step = 3;

  // The verdict: holds, fails or gap.
  string verdict = 4;

  // Why the reviewer gave the verdict.
  string reason = 5;
}

// EpicLedgerFinding is one finding a reviewer returned, as the review's ledger holds it.
message EpicLedgerFinding {
  // The ledger id, <reviewer>-<k>, where k is the finding's 1-based position among the reviewer's findings.
  string id = 1;

  // The finding's 1-based place in the ledger.
  int64 position = 2;

  // The reviewer's name.
  string reviewer = 3;

  // The finding id the reviewer returned.
  string finding = 4;

  // The claim the finding makes.
  string claim = 5;

  // The citation the finding gives for its claim.
  string citation = 6;

  // The location the finding names.
  string location = 7;

  // The evidence the finding gives.
  string evidence = 8;

  // How the verifier is to check the finding.
  string verify_by = 9;

  // The verifier step. Empty when the finding is unverified.
  string step = 10;

  // The verifier's result: confirmed, dropped or undetermined.
  string result = 11;

  // Whether verification was off. An unverified finding is confirmed and has no verifier step.
  bool unverified = 12;

  // Why the verifier reached the result.
  string reason = 13;

  // The closure verifier's result for the finding in each correction round, in round order.
  repeated EpicClosure closures = 14;
}

// EpicClosure is the closure verifier's result for one ledger finding in one correction round.
message EpicClosure {
  // The correction round.
  int64 round = 1;

  // The closure verifier step.
  string step = 2;

  // The closure result: closed, open or undetermined.
  string result = 3;

  // Why the closure verifier reached the result.
  string reason = 4;
}

// EpicReviewRound is one correction round of the epic's review: the correction tasks it ran and how its closure run
// ended.
message EpicReviewRound {
  // The correction round.
  int64 round = 1;

  // The stored base the round's closure verifiers ran at.
  string revision = 2;

  // The round's correction task seqs, in order.
  repeated int64 tasks = 3;

  // The closure run's outcome: passed or failed.
  string outcome = 4;
}

// StoredEpic is a stored epic with its contract, phase, times, decisions and planner state.
message StoredEpic {
  // The epic's contract as created.
  EpicContract contract = 1;

  // The epic's phase, accepted when it is created.
  string phase = 2;

  // When the epic was created, in unix seconds.
  int64 created = 3;

  // When the epic last changed, in unix seconds.
  int64 changed = 4;

  // The epic's decisions in the order they were recorded.
  repeated EpicDecision decisions = 5;

  // Whether the epic is paused. A paused epic starts no planner turn until it is resumed.
  bool paused = 6;

  // Why the epic is parked, empty when it is not parked. A parked epic starts no planner turn.
  string parked = 7;

  // The epic's planner turns in the order they started.
  repeated EpicTurn turns = 8;

  // The tasks the epic's planner turns planned, in the order they were planned.
  repeated EpicTask tasks = 9;

  // The questions the epic's planner turns asked, in the order they were asked.
  repeated EpicQuestion questions = 10;

  // The state of the epic's branch: empty before it is created, creating while it is being created, then created.
  string branch = 11;

  // The workflow the epic pinned when it was created.
  EpicWorkflow workflow = 12;

  // The epic's workflow node runs in the order of the pinned workflow's nodes, then by path, with a run of a node the
  // workflow does not hold after the others. Every epic RPC that returns the epic fills it.
  repeated EpicNode nodes = 13;

  // The epic's reviewers, merged from orrery's defaults, the project file and the contract, in the order their names
  // first appear.
  repeated EpicReviewer reviewers = 14;

  // The epic's end-of-epic review: its verdicts, its ledger of findings with their closures, and its correction rounds.
  // Empty before the review starts.
  EpicLedger ledger = 15;

  // The revision the review froze. Empty before the review freezes.
  string frozen = 16;

  // The revision the epic ended clean at. Empty until the epic ends clean.
  string clean = 17;

  // The epic's release runs in the order the store reads them: by attempt, then part, then position. Every epic RPC
  // that returns the epic fills it.
  repeated EpicReleaseRun releases = 18;

  // The epic that holds the release slot of the epic's repository, empty when the slot is free. A waiting epic shows
  // whose release it waits on.
  string release_slot = 19;

  // The epic's summary, written once from its contract. Empty until it is written.
  string summary = 20;

  // The epic's triggers, oldest first. Only a GetEpic that asks for history fills them.
  repeated EpicTrigger triggers = 21;

  // The epic's tells in seq order. Only a GetEpic that asks for history fills them.
  repeated EpicTell tells = 22;

  // When the epic's phase was last set, in unix seconds.
  int64 phase_at = 23;

  // The epic's report, written when the epic ends. Unset until it is written.
  EpicReport report = 24;

  // The epic's release steps, each with the state its release runs give it, in contract order.
  repeated EpicReleaseProof release_proof = 25;

  // When the owner last saw the epic, in unix seconds, from its latest SeeEpic; 0 when the owner has not seen it.
  int64 seen = 26;

  // The class of the epic's park, which says who answers it. Empty when the epic is not parked.
  string park_class = 27;

  // The amendments of the evidence items of the epic's Requirements, in the order they were asked for.
  repeated EpicAmendment amendments = 28;

  // The epic a close named as its replacement, empty when the epic is not closed or its close named none.
  string superseded_by = 29;

  // How many writes have changed the epic's row or a row of its parts, its steps aside, as EpicSummary.revision counts.
  int64 revision = 30;

  // The id of the session that steers the orreryd epic, empty when it has none.
  string steerer = 31;

  // Why the orreryd epic is paused, 'owner' or 'limit' while it is paused, empty otherwise.
  string pause_source = 32;

  // The epic's steering actions in seq order. Only a GetEpic that asks for history fills them.
  repeated EpicAction actions = 33;
}

// EpicAction is one action taken on an epic's steering or controls, such as a move.
message EpicAction {
  // The action's position on the epic, counted from 1.
  int64 seq = 1;

  // What the action did, such as move.
  string kind = 2;

  // When the action was taken, in unix seconds.
  int64 time = 3;

  // Who took the action, as the store records its maker.
  string by = 4;

  // The session that took the action, empty when none did.
  string session = 5;

  // The session the action moved the epic from, empty when none.
  string from = 6;

  // The session the action moved the epic to, empty when none.
  string to = 7;
}

// EpicReleaseRun is one release run of an epic: the candidate it starts from, a release step, a named step, or the judge.
message EpicReleaseRun {
  // The run's part: candidate, release, judge or named.
  string part = 1;

  // The run's position within its part, from 1.
  int64 position = 2;

  // The attempt of the release node run the run was recorded under.
  int64 attempt = 3;

  // The release step the run is for.
  string step = 4;

  // The revision the run started at.
  string start = 5;

  // The revision the run recorded as its head.
  string head = 6;

  // The end of the run's step, such as done or failed: a release step's or the judge's.
  string end = 7;

  // The commits the run made, in order.
  repeated string commits = 8;

  // The evidence the run's step returned, as text.
  string evidence = 9;

  // Whether the run passed.
  bool passed = 10;

  // The reason the run recorded, such as why a step failed; empty when it recorded none.
  string reason = 11;

  // When the run was recorded, in unix seconds.
  int64 at = 12;
}

// EpicReleaseProof is one release step of an epic with the state its release runs give it.
message EpicReleaseProof {
  // The step's place in the contract's release steps, counted from 1.
  int64 position = 1;

  // What the step does.
  string step = 2;

  // Where the step sends what leaves the machine.
  string target = 3;

  // How the step is undone.
  string undo = 4;

  // The step's state: waiting, running, passed or failed.
  string state = 5;

  // The evidence the deciding run gave; empty when no run has decided the step.
  string evidence = 6;

  // Why the deciding run passed or failed; empty when no run has decided the step.
  string reason = 7;

  // The attempt the deciding run belongs to, counted from 1.
  int64 attempt = 8;

  // When the deciding run was recorded, in unix seconds; 0 when no run has decided the step.
  int64 at = 9;
}

// EpicReport is what an ended epic shipped of its contract's Requirements, and what it did not.
message EpicReport {
  // The ending phase the report reports.
  string outcome = 1;

  // The Requirement ids the epic shipped, in contract order.
  repeated string shipped = 2;

  // The Requirement ids the epic did not ship, in contract order.
  repeated string not_shipped = 3;

  // Why the epic shipped what it did and left the rest out.
  string why = 4;
}

// EpicSummary is an epic's head fields, without its contract.
message EpicSummary {
  // The epic's id, "<repo-id>/<epic-slug>".
  string id = 1;

  // The absolute path of the git repository the epic belongs to.
  string repository = 2;

  // The epic's name.
  string title = 3;

  // The epic's phase.
  string phase = 4;

  // When the epic was created, in unix seconds.
  int64 created = 5;

  // When the epic last changed, in unix seconds.
  int64 changed = 6;

  // When the epic's phase was last set, in unix seconds.
  int64 phase_at = 7;

  // When the owner last saw the epic, in unix seconds, from its latest SeeEpic; 0 when the owner has not seen it.
  int64 seen = 8;

  // How many writes have changed the epic's row or a row of its parts, its steps aside. It only grows, so an epic whose
  // revision moved has changed in some part that GetEpic answers.
  int64 revision = 9;

  // The id of the session that steers the orreryd epic, empty when it has none or for a record epic.
  string steerer = 10;

  // Whether the epic is paused. A paused epic starts no planner turn until it is resumed.
  bool paused = 11;

  // Why the epic is paused, 'owner' or 'limit' while it is paused, empty otherwise.
  string pause_source = 12;

  // Why the epic is parked, empty when it is not parked.
  string parked = 13;

  // How many of the epic's questions are open.
  int32 open_questions = 14;
}

// CreateEpicRequest asks for a new epic.
message CreateEpicRequest {
  // The contract to store.
  EpicContract contract = 1;

  // The seed decisions, recorded in order as the epic's first decisions.
  repeated EpicDecisionInput decisions = 2;

  // The name of the workflow the epic pins, read at the contract's base. Empty pins the built-in epic.
  string workflow = 3;
}

// CreateEpicResponse carries the stored epic and the warnings its contract drew. The epic is stored with them.
message CreateEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;

  // One warning for each lint finding that does not refuse the contract: a go test whose -run pattern matches a test at
  // the base, or a release step that says merge, names a fixed version or waits on CI. Each names its field and reason.
  repeated string warnings = 2;
}

// GetEpicRequest names one epic.
message GetEpicRequest {
  // The epic's id.
  string id = 1;

  // Whether the reply carries the epic's triggers and tells. Without it, the reply has neither.
  bool history = 2;
}

// GetEpicResponse carries one stored epic.
message GetEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// ListEpicsRequest asks for every stored epic. It has no fields.
message ListEpicsRequest {}

// ListEpicsResponse carries the summary of every stored epic.
message ListEpicsResponse {
  // The summaries of the stored epics.
  repeated EpicSummary epics = 1;
}

// AnswerEpicRequest records the owner's answer to one epic.
message AnswerEpicRequest {
  // The id of the epic the answer belongs to.
  string epic_id = 1;

  // The decision's id.
  string id = 2;

  // The owner's answer.
  string text = 3;

  // The question, Q<n>, the answer names; empty for a note.
  string question = 4;

  // The choice the answer gives to the question: a declared choice's id, or other. Empty for a note.
  string choice = 5;
}

// AnswerEpicResponse carries the recorded decision.
message AnswerEpicResponse {
  // The decision recorded, or the stored decision with the same text.
  EpicDecision decision = 1;

  // A warning set when a note is recorded while questions are open; empty otherwise.
  string warning = 2;
}

// MoveEpicRequest names the epic to move and the session to move it to.
message MoveEpicRequest {
  // The epic's id.
  string id = 1;

  // The session to move the epic's steering to. Empty names the calling conversation.
  string session = 2;
}

// MoveEpicResponse carries the moved epic.
message MoveEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// ContinueEpicRequest names the epic to continue.
message ContinueEpicRequest {
  // The epic's id.
  string id = 1;
}

// ContinueEpicResponse carries the continued epic and the steering session started for it.
message ContinueEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;

  // The id of the steering session started for the epic.
  string session = 2;
}

// PauseEpicRequest names the epic to pause.
message PauseEpicRequest {
  // The epic's id.
  string id = 1;
}

// PauseEpicResponse carries the paused epic.
message PauseEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// ResumeEpicRequest names the epic to resume.
message ResumeEpicRequest {
  // The epic's id.
  string id = 1;
}

// ResumeEpicResponse carries the resumed epic, the limited steps it resumed and the limited steps a full step cap left
// limited.
message ResumeEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;

  // The ids of the limited steps the resume resumed, oldest first.
  repeated string resumed = 2;

  // The ids of the limited steps the resume left limited because the step cap was full, oldest first.
  repeated string still_limited = 3;
}

// StopEpicRequest names the epic to stop.
message StopEpicRequest {
  // The epic's id.
  string id = 1;
}

// StopEpicResponse carries the stopped epic.
message StopEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// RetryEpicRequest names the epic to retry, and the node to rerun when node is set.
message RetryEpicRequest {
  // The epic's id.
  string id = 1;

  // The workflow node id whose parked run reruns under its next attempt. Empty retries the epic's park instead.
  string node = 2;
}

// RetryEpicResponse carries the retried epic.
message RetryEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// KickEpicRequest names the epic to kick and the owner's text the kick records.
message KickEpicRequest {
  // The epic's id.
  string id = 1;

  // The owner's words, which the planner reads at the epic's next plan run.
  string text = 2;
}

// KickEpicResponse carries the kicked epic.
message KickEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// FollowEpicsRequest asks for the follow counts of every label. It has no fields.
message FollowEpicsRequest {}

// FollowEpicsResponse carries the follow counts of every label.
message FollowEpicsResponse {
  // The follow counts, one per label in label order. Empty when no answered question had a recommendation.
  repeated EpicFollow follows = 1;
}

// EpicFollow is one label's count of how often the owner took the advice across all epics.
message EpicFollow {
  // The label.
  string label = 1;

  // The answered questions with the label that had a recommendation.
  int64 answered = 2;

  // The answered questions with the label that were answered with the recommended choice.
  int64 followed = 3;
}

// ReleaseEpicRequest names the epic to release, and the undo-none release steps to run again when its stopped release
// resumes.
message ReleaseEpicRequest {
  // The epic's id.
  string id = 1;

  // The positions, from 1, of the undo-none release steps the owner names to run again. Empty names none.
  repeated int32 undo_none = 2;
}

// ReleaseEpicResponse carries the epic read back after its release resumed or started.
message ReleaseEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// CloseEpicRequest names the epic to close, the kind it closes as and, for superseded, the epic that replaces it.
message CloseEpicRequest {
  // The epic's id.
  string id = 1;

  // The close kind: superseded, shipped or abandoned.
  string kind = 2;

  // The epic that replaces this one. A superseded close requires it.
  string by = 3;
}

// CloseEpicResponse carries the epic read back after its close.
message CloseEpicResponse {
  // The stored epic.
  StoredEpic epic = 1;
}

// AmendEvidenceRequest names the epic, the Requirement whose evidence item to amend, the item it should hold and why.
message AmendEvidenceRequest {
  // The epic's id.
  string id = 1;

  // The id of the Requirement to amend, such as R2.
  string requirement = 2;

  // The evidence item the Requirement should hold in place of its own.
  EvidenceItem item = 3;

  // Why the item is amended, recorded with the amendment.
  string reason = 4;
}

// AmendEvidenceResponse carries the stored amendment, checking, and the epic read back after it.
message AmendEvidenceResponse {
  // The amendment as stored.
  EpicAmendment amendment = 1;

  // The stored epic.
  StoredEpic epic = 2;
}

// EpicAmendment is one amendment of a Requirement's evidence item.
message EpicAmendment {
  // The amendment's number on its epic, from 1, shown as A<seq>.
  int64 seq = 1;

  // The id of the Requirement it amends.
  string requirement = 2;

  // Who asked for it: owner or planner.
  string amender = 3;

  // The turn of the planner action that asked for it; 0 when no action did.
  int64 turn = 4;

  // The 1-based position of that action in its turn's return; 0 when no action did.
  int64 position = 5;

  // The item the Requirement held when the amendment was asked for.
  EvidenceItem prior_item = 6;

  // The item the amendment asks the Requirement to hold.
  EvidenceItem item = 7;

  // Why it was asked for.
  string reason = 8;

  // The epic's base, where the red run of the new item runs.
  string base = 9;

  // checking while that red run is judged, refused when it is refused, capturing once the new item is applied and its
  // green runs at the stored base, and applied once it is done.
  string state = 10;

  // The attempt of the red run, from 0; a run lost at a restart, or that exited for its environment, runs again.
  int64 red_attempt = 11;

  // The id of the red run of the new item at the base.
  string red_run = 12;

  // The stored base the green run and reproduction run at; empty until the amendment is capturing, and for one applied
  // with nothing integrated yet.
  string stored_base = 13;

  // The attempt of the green run and reproduction, from 0.
  int64 green_attempt = 14;

  // The id of the green run of the new item at the stored base; empty when it has none.
  string green_run = 15;

  // The id of the reproduction check of a test item at the epic's base; empty when it has none.
  string repro_check = 16;

  // Why a refused amendment was refused; empty otherwise.
  string refusal = 17;

  // When it was asked for, in unix seconds.
  int64 created = 18;

  // When it left checking, applied or refused, in unix seconds; 0 while it is checking.
  int64 settled = 19;
}

// SeeEpicRequest names the stored epic the owner saw.
message SeeEpicRequest {
  // The epic's id.
  string id = 1;
}

// SeeEpicResponse is the reply to a SeeEpic. It has no fields.
message SeeEpicResponse {}

// ArchiveRowRequest names the list row the owner archives.
message ArchiveRowRequest {
  // The row's kind: epic, session or headless.
  string kind = 1;

  // The row's id.
  string id = 2;
}

// ArchiveRowResponse is the reply to an ArchiveRow. It has no fields.
message ArchiveRowResponse {}

// UnarchiveRowRequest names the list row the owner unarchives.
message UnarchiveRowRequest {
  // The row's kind: epic, session or headless.
  string kind = 1;

  // The row's id.
  string id = 2;
}

// UnarchiveRowResponse is the reply to an UnarchiveRow. It has no fields.
message UnarchiveRowResponse {}

// RunEvidenceRequest asks for one item's evidence to run at a revision for one phase.
message RunEvidenceRequest {
  // The id of the epic the item belongs to.
  string epic = 1;

  // The requirement or task the evidence shows.
  string item = 2;

  // The commit the evidence runs at.
  string revision = 3;

  // The phase the run is for: red or green.
  string phase = 4;
}

// RunEvidenceResponse carries the evidence run.
message RunEvidenceResponse {
  // The evidence run.
  EvidenceRun run = 1;
}

// ListEvidenceRequest asks for the evidence runs an epic holds.
message ListEvidenceRequest {
  // The epic's id.
  string epic = 1;
}

// ListEvidenceResponse carries the evidence runs an epic holds.
message ListEvidenceResponse {
  // The epic's evidence runs.
  repeated EvidenceRun runs = 1;
}

// GetEvidenceArtifactRequest names one artifact of an evidence run.
message GetEvidenceArtifactRequest {
  // The evidence run's id.
  string run = 1;

  // The artifact's repository-relative path; empty for the run's log.
  string name = 2;

  // Whether to read the run's stderr log instead of its stdout log; applies only when name is empty.
  bool stderr = 3;
}

// GetEvidenceArtifactResponse carries one artifact's bytes.
message GetEvidenceArtifactResponse {
  // The artifact's bytes, or the run's log's bytes.
  bytes data = 1;

  // The sha256 of the bytes.
  string hash = 2;
}
