syntax = "proto3";

package orrery.v1;

import "orrery/v1/designs.proto";
import "orrery/v1/epics.proto";

// Contracts reads the contracts orreryd keeps, from the store, and forwards the owner's accept, set aside and reopen to
// orreryd, which records them as the owner's.
service Contracts {
  // List returns every contract, created ascending, then by id, with no versions or states.
  rpc List(ContractsListRequest) returns (ContractsListResponse);

  // Get returns one contract by the id List gave it, with its versions and state changes.
  rpc Get(ContractsGetRequest) returns (ContractsGetResponse);

  // Accept forwards the owner's acceptance of the named contract to orreryd and returns the contract as it stands.
  rpc Accept(ContractsAcceptRequest) returns (ContractsAcceptResponse);

  // SetAside forwards the owner's set aside of the named contract to orreryd and returns the contract as it stands.
  rpc SetAside(ContractsSetAsideRequest) returns (ContractsSetAsideResponse);

  // Reopen forwards the owner's reopening of the named contract to orreryd and returns the contract as it stands.
  rpc Reopen(ContractsReopenRequest) returns (ContractsReopenResponse);

  // Keep forwards the owner's keeping of an addition to the named contract to orreryd and returns the contract as it
  // stands.
  rpc Keep(ContractsKeepRequest) returns (ContractsKeepResponse);

  // Strike forwards the owner's striking of an addition the named contract keeps to orreryd and returns the contract as
  // it stands, with the rows the striking removed.
  rpc Strike(ContractsStrikeRequest) returns (ContractsStrikeResponse);

  // Shown forwards the rows of a contract version the owner was shown to orreryd and returns the rows it marked.
  rpc Shown(ContractsShownRequest) returns (ContractsShownResponse);
}

// Contract is one contract as List gives it.
message Contract {
  // The contract's id, the id of the epic made from it once accepted.
  string id = 1;

  // The current version's repository.
  string repository = 2;

  // The current version's title.
  string title = 3;

  // The current version's care: limited, serious or severe.
  string care = 4;

  // The contract's state: proposed, accepted or set_aside.
  string state = 5;

  // The current, newest version number, counted from 1.
  int64 version = 6;

  // The decisions of the current version that have no answer.
  int64 open_decisions = 7;

  // The conversation that proposed the contract: the writer of version 1.
  string conversation = 8;

  // When version 1 was stored, in unix seconds.
  int64 created = 9;

  // When the newest version or state change was stored, whichever is later, in unix seconds.
  int64 changed = 10;
}

// ContractDecision is one decision a contract's version asks the owner to answer.
message ContractDecision {
  // The decision's id, D<n>.
  string id = 1;

  // The question the decision asks.
  string question = 2;

  // The options the owner may choose from.
  repeated string options = 3;

  // The option the planner recommends.
  string recommendation = 4;

  // Why the decision is needed.
  string reason = 5;

  // The F, R or P row the decision concerns; empty when it concerns none.
  string row = 6;

  // The owner's answer; empty while the decision is open.
  string answer = 7;
}

// ContractVersion is one stored version of a contract: the body it proposed and what changed from the version before.
message ContractVersion {
  // The version's number, counted from 1.
  int64 version = 1;

  // The body's sections. Its accepted field is left 0.
  EpicContract contract = 2;

  // The body's requirements in order, with no runs.
  repeated EpicRequirement requirements = 3;

  // The decisions the version asks the owner to answer.
  repeated ContractDecision decisions = 4;

  // The words the writer gave with the version.
  string words = 5;

  // The writer's session id.
  string writer = 6;

  // When the version was stored, in unix seconds.
  int64 time = 7;

  // The F, R, P and decision ids whose text differs from the version before; empty for version 1.
  repeated string changed_rows = 8;

  // The section names whose values differ from the version before; empty for version 1.
  repeated string changed_sections = 9;

  // The ids of the steps that read this version, oldest first.
  repeated string read_by = 10;
}

// ContractStateChange is one change of a contract's state.
message ContractStateChange {
  // The state the contract changed to: proposed, accepted or set_aside.
  string state = 1;

  // The contract's version when the change was made.
  int64 version = 2;

  // Who made the change: owner or session.
  string by = 3;

  // The writer's session id when by is session; empty for the owner.
  string session = 4;

  // The words the change was made with.
  string words = 5;

  // When the change was made, in unix seconds.
  int64 time = 6;

  // Who made the change and the evidence it rests on.
  RecordMaker maker = 7;
}

// ContractsListRequest asks for every contract.
message ContractsListRequest {}

// ContractsListResponse carries every contract.
message ContractsListResponse {
  // The contracts, created ascending, then by id.
  repeated Contract contracts = 1;
}

// ContractsGetRequest names one contract.
message ContractsGetRequest {
  // The contract's id, as List gave it.
  string id = 1;
}

// ContractsGetResponse carries one contract with its versions and state changes.
message ContractsGetResponse {
  // The contract.
  Contract contract = 1;

  // The contract's versions, oldest first.
  repeated ContractVersion versions = 2;

  // The contract's state changes, oldest first.
  repeated ContractStateChange states = 3;

  // The contract's working copy: the body the stage is working on, with the decisions it asks and who wrote it.
  ContractWorking working = 4;

  // The refusals the contract's stage recorded, oldest first.
  repeated ContractRefusal refusals = 5;

  // The row writes the contract's stage recorded, oldest first.
  repeated ContractRowWrite rows = 6;

  // The left items the contract's stage recorded, oldest first.
  repeated ContractLeft left = 7;

  // The requirements' work the contract's stage recorded, one per requirement the work covers.
  repeated ContractRequirementWork work = 8;

  // The rows the owner was shown, oldest first.
  repeated ContractShown shown = 9;

  // The contract's length: the lines above its checks in the body the page draws, which is the working copy's when the
  // contract has one and the newest version's otherwise. Unset when that body is not counted, as when the settings file
  // does not read.
  ContractLength length = 10;
}

// ContractLength is a contract's length, counted in lines above its checks, against the thresholds the settings file
// sets.
message ContractLength {
  // The lines above the checks.
  int64 lines = 1;

  // The warning threshold: lines at or past it warn.
  int64 warn = 2;

  // The strong warning threshold: lines at or past it warn strongly, to cut or split the contract.
  int64 strong = 3;
}

// ContractWorking is a contract's working copy: the body its stage works on, with the decisions it asks the owner to
// answer.
message ContractWorking {
  // The working copy's version number, counted from 1.
  int64 version = 1;

  // The body's sections.
  EpicContract contract = 2;

  // The body's requirements in order.
  repeated EpicRequirement requirements = 3;

  // The decisions the working copy asks the owner to answer.
  repeated ContractDecision decisions = 4;

  // The sessions row id of the session that wrote the working copy.
  string writer = 5;

  // When the working copy was last updated, in unix seconds.
  int64 updated = 6;

  // The F, R, P and decision ids whose text differs from the version before.
  repeated string changed_rows = 7;
}

// ContractRefusal is a refusal the contract's stage recorded for a field of its body.
message ContractRefusal {
  // The refusal's seq, counted from 1 within its contract.
  int64 seq = 1;

  // The number of the contract version the refusal concerns.
  int64 version = 2;

  // The field the refusal concerns.
  string field = 3;

  // The refusal's text.
  string text = 4;

  // The sessions row id of the session that recorded the refusal.
  string session = 5;

  // When the refusal was recorded, in unix seconds.
  int64 time = 6;
}

// ContractRowWrite is a write to a row of a contract's body, as its stage recorded it.
message ContractRowWrite {
  // The write's seq, counted from 1 within its contract.
  int64 seq = 1;

  // The number of the contract version the write made.
  int64 version = 2;

  // The F, R or P row the write concerns.
  string row = 3;

  // What the write did to the row.
  string action = 4;

  // The row the written row depends on.
  string depends = 5;

  // The owner's words the write is made with.
  string words = 6;

  // Who made the write and the evidence it rests on.
  RecordMaker maker = 7;

  // When the write was stored, in unix seconds.
  int64 time = 8;
}

// ContractLeft is an item the contract's stage left, with the kind of item and the id it refers to.
message ContractLeft {
  // The kind of item left.
  string kind = 1;

  // The id of the item left.
  string ref = 2;

  // The item's text.
  string text = 3;
}

// ContractShown is a row of a contract version the owner was shown.
message ContractShown {
  // The number of the contract version the owner was shown.
  int64 version = 1;

  // The F, R or P row the owner was shown.
  string row = 2;

  // When the owner was shown the row, in unix seconds.
  int64 time = 3;
}

// ContractRequirementWork is the work done on one requirement of a contract: its tasks and the evidence run that proves
// it.
message ContractRequirementWork {
  // The requirement's id, R<n>.
  string id = 1;

  // The requirement's text.
  string text = 2;

  // The requirement's state.
  string state = 3;

  // The tasks that cover the requirement.
  repeated ContractRequirementTask tasks = 4;

  // The evidence run that proves the requirement.
  EvidenceRun proof = 5;
}

// ContractRequirementTask is a task that covers a requirement of a contract.
message ContractRequirementTask {
  // The task's id.
  string id = 1;

  // The task's title.
  string title = 2;

  // The task's status.
  string status = 3;

  // The task's place in the build order.
  string place = 4;
}

// ContractsAcceptRequest names the contract the owner accepts.
message ContractsAcceptRequest {
  // The contract's id, as List gave it.
  string id = 1;

  // The words the owner accepts with; may be empty.
  string words = 2;
}

// ContractsAcceptResponse carries the contract as it stands after the acceptance.
message ContractsAcceptResponse {
  // The contract.
  Contract contract = 1;
}

// ContractsSetAsideRequest names the contract the owner sets aside.
message ContractsSetAsideRequest {
  // The contract's id, as List gave it.
  string id = 1;

  // The words the owner sets the contract aside with.
  string words = 2;
}

// ContractsSetAsideResponse carries the contract as it stands after it was set aside.
message ContractsSetAsideResponse {
  // The contract.
  Contract contract = 1;
}

// ContractsReopenRequest names the contract the owner reopens.
message ContractsReopenRequest {
  // The contract's id, as List gave it.
  string id = 1;

  // The words the owner reopens the contract with; may be empty.
  string words = 2;
}

// ContractsReopenResponse carries the contract as it stands after it was reopened.
message ContractsReopenResponse {
  // The contract.
  Contract contract = 1;
}

// ContractsKeepRequest names the contract and the addition the owner keeps.
message ContractsKeepRequest {
  // The contract's id, as List gave it.
  string id = 1;

  // The addition the contract keeps.
  string addition = 2;

  // The words the owner keeps the addition with; may be empty.
  string words = 3;
}

// ContractsKeepResponse carries the contract as it stands after the addition was kept.
message ContractsKeepResponse {
  // The contract.
  Contract contract = 1;
}

// ContractsStrikeRequest names the contract and the addition the owner strikes.
message ContractsStrikeRequest {
  // The contract's id, as List gave it.
  string id = 1;

  // The addition the contract keeps, which the owner strikes.
  string addition = 2;

  // The words the owner strikes the addition with; may be empty.
  string words = 3;
}

// ContractsStrikeResponse carries the contract as it stands after the striking, and the rows the striking removed.
message ContractsStrikeResponse {
  // The contract.
  Contract contract = 1;

  // The rows the striking removed.
  repeated string removed = 2;
}

// ContractsShownRequest names the contract version the owner was shown and the rows the owner was shown.
message ContractsShownRequest {
  // The contract's id, as List gave it.
  string id = 1;

  // The number of the contract version the owner was shown.
  int64 version = 2;

  // The F, R or P rows the owner was shown.
  repeated string rows = 3;
}

// ContractsShownResponse carries the rows orreryd marked as shown.
message ContractsShownResponse {
  // The rows orreryd marked.
  repeated string rows = 1;
}
