syntax = "proto3";

package orrery.v1;

// Notices streams the notices open web pages show in-app, takes the page's word that the owner opened one, lists the
// notice history and marks it read. serve forwards every call to orreryd.
service Notices {
  // Watch streams the in-app notices: first one shown message for each notice showing now, then a shown message for
  // each notice shown later and an ended message for each one that ends. A notice shown again under the same key
  // replaces the earlier one. The stream ends when serve or orreryd stops. With no orreryd to forward to, Watch is
  // unavailable.
  rpc Watch(NoticesWatchRequest) returns (stream NoticesWatchResponse);

  // Seen records that the owner opened the notice under key, as seen at orreryd's own clock. A key that sets none or
  // more than one of its fields is invalid_argument. With no orreryd to forward to, Seen is unavailable.
  rpc Seen(NoticesSeenRequest) returns (NoticesSeenResponse);

  // List returns the notices orreryd showed at the desk or sent away with their desk text built, timed within the last
  // 14 days, newest first, each with its read mark. With no orreryd to forward to, List is unavailable.
  rpc List(NoticesListRequest) returns (NoticesListResponse);

  // ReadAll marks every notice in the notice history read. With no orreryd to forward to, ReadAll is unavailable.
  rpc ReadAll(NoticesReadAllRequest) returns (NoticesReadAllResponse);
}

// NoticeKey names what a notice is about. Exactly one of pane, session, epic, limit and alert is set. host is set with
// pane and only with pane.
message NoticeKey {
  // The tmux pane id, % followed by digits.
  string pane = 1;

  // The headless session's or the step's id.
  string session = 2;

  // The epic's id.
  string epic = 3;

  // The usage limit, its kind and reset as kind@unix-seconds.
  string limit = 4;

  // The alert's name.
  string alert = 5;

  // The orrery name of the pane's host. It is set with pane and only with pane.
  string host = 6;
}

// NoticeBlock names the block of an epic's page that a notice opens on.
message NoticeBlock {
  // The kind of block: question, release_step, contract or report.
  string kind = 1;

  // The question's id, Q<n>, for a question; the release step's position in decimal for a release_step.
  string ref = 2;
}

// InAppNotice is one notice an open web page shows.
message InAppNotice {
  // What the notice is about.
  NoticeKey key = 1;

  // The state the notice reports, such as waiting, done or limited.
  string state = 2;

  // The notice's title.
  string title = 3;

  // The notice's body.
  string body = 4;

  // The block of the epic's page the notice opens on; unset opens the epic view.
  NoticeBlock block = 5;
}

// NoticesWatchRequest opens the in-app notice stream. It has no fields.
message NoticesWatchRequest {}

// NoticesWatchResponse is one change to the in-app notices. Exactly one of shown and ended is set.
message NoticesWatchResponse {
  oneof change {
    // A notice that shows now, or replaces the one shown under its key.
    InAppNotice shown = 1;

    // The key of a notice that ended.
    NoticeKey ended = 2;
  }
}

// NoticesSeenRequest names the notice the owner opened.
message NoticesSeenRequest {
  // The opened notice's key.
  NoticeKey key = 1;
}

// NoticesSeenResponse is the reply to a Seen. It has no fields.
message NoticesSeenResponse {}

// ListedNotice is one notice in the notice history: a notice orreryd showed at the desk or sent away with its desk text
// built.
message ListedNotice {
  // What the notice is about.
  NoticeKey key = 1;

  // The state the notice reports, such as waiting, done or limited.
  string state = 2;

  // The notice's title.
  string title = 3;

  // The notice's body.
  string body = 4;

  // The block of the epic's page the notice opens on; unset opens the epic view.
  NoticeBlock block = 5;

  // When the router delivered the notice, in unix seconds.
  int64 time = 6;

  // Whether the owner has read the notice.
  bool read = 7;
}

// NoticesListRequest asks for the notice history. It has no fields.
message NoticesListRequest {}

// NoticesListResponse is the reply to a List: the notices in the history, newest first.
message NoticesListResponse {
  // The notices timed within the last 14 days, newest first.
  repeated ListedNotice notices = 1;
}

// NoticesReadAllRequest asks that every notice in the notice history be marked read. It has no fields.
message NoticesReadAllRequest {}

// NoticesReadAllResponse is the reply to a ReadAll. It has no fields.
message NoticesReadAllResponse {}
