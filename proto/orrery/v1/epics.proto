syntax = "proto3";

package orrery.v1;

// Epics reads the epics under the gambit record root and the epics orreryd's database holds.
service Epics {
  // List returns every epic under the record root and in orreryd's database, one per id, live or folded.
  rpc List(EpicsListRequest) returns (EpicsListResponse);

  // Get returns one epic by the id List gave it.
  rpc Get(EpicsGetRequest) returns (EpicsGetResponse);

  // History returns one page of an epic's turns, triggers, steps, evidence runs, decisions and tells, oldest first.
  rpc History(EpicsHistoryRequest) returns (EpicsHistoryResponse);

  // Pause pauses the named orreryd epic, so its planner starts no turn.
  rpc Pause(EpicsPauseRequest) returns (EpicsPauseResponse);

  // Resume clears the named orreryd epic's pause and resumes its limited task steps.
  rpc Resume(EpicsResumeRequest) returns (EpicsResumeResponse);

  // Stop pauses the named orreryd epic and stops the step of its running turn.
  rpc Stop(EpicsStopRequest) returns (EpicsStopResponse);

  // Retry ends the named orreryd epic's park, or reruns the parked runs of one of its workflow nodes.
  rpc Retry(EpicsRetryRequest) returns (EpicsRetryResponse);

  // Kick records the owner's text on the named orreryd epic as a decision and wakes its planner with it at the epic's
  // next plan run.
  rpc Kick(EpicsKickRequest) returns (EpicsKickResponse);

  // Answer records the owner's answer on the named orreryd epic, tied to the question it names or as a note.
  rpc Answer(EpicsAnswerRequest) returns (EpicsAnswerResponse);

  // Seen records that the owner saw the named orreryd epic, so its seen mark is the time of this call.
  rpc Seen(EpicsSeenRequest) returns (EpicsSeenResponse);

  // Archive archives the named list row, so the lists hide it. kind is epic, session or headless.
  rpc Archive(EpicsArchiveRequest) returns (EpicsArchiveResponse);

  // Unarchive clears the archive mark of the named list row, so the lists show it again.
  rpc Unarchive(EpicsUnarchiveRequest) returns (EpicsUnarchiveResponse);

  // Release releases the named orreryd epic, which resumes its stopped release at the first unfinished step and runs
  // again the undo-none release steps the owner names.
  rpc Release(EpicsReleaseRequest) returns (EpicsReleaseResponse);

  // Close closes the named orreryd epic as superseded, shipped by hand or abandoned, and records the owner as its
  // closer.
  rpc Close(EpicsCloseRequest) returns (EpicsCloseResponse);
}

// Steps carries the owner's calls on one labelled step. It has no call that starts a step.
service Steps {
  // Hold interrupts the step's running turn and holds the step until a nudge or a stop.
  rpc Hold(StepsHoldRequest) returns (StepsHoldResponse);

  // Nudge sends the owner's text to the step.
  rpc Nudge(StepsNudgeRequest) returns (StepsNudgeResponse);

  // Stop ends the step's loop.
  rpc Stop(StepsStopRequest) returns (StepsStopResponse);
}

// Evidence reads the artifacts evidence runs kept.
service Evidence {
  // Artifact returns one artifact of an evidence run, or the run's log when the name is empty.
  rpc Artifact(EvidenceArtifactRequest) returns (EvidenceArtifactResponse);
}

// EpicsListRequest asks for every epic. It has no fields.
message EpicsListRequest {}

// EpicsListResponse carries every epic.
message EpicsListResponse {
  // The epics, sorted by id.
  repeated Epic epics = 1;
}

// EpicsGetRequest names one epic.
message EpicsGetRequest {
  // The epic's id, as List gave it.
  string id = 1;
}

// EpicsGetResponse carries one epic with its tasks and its steps.
message EpicsGetResponse {
  // The epic.
  Epic epic = 1;

  // The tasks of the epic's efforts, effort number ascending and file order within each effort.
  repeated EpicTask tasks = 2;

  // Every step labelled with the epic, oldest first.
  repeated EpicStep steps = 3;

  // A slice per task label among the epic's labelled writing steps, in order of each label's first start. Read-only
  // steps and steps with no task label add none.
  repeated EpicSlice slices = 4;

  // The orreryd epic's requirements in contract order, empty for a record epic.
  repeated EpicRequirement requirements = 5;

  // The orreryd epic's workflow node runs in the engine's order, empty for a record epic.
  repeated EpicNode nodes = 6;

  // The orreryd epic's planned tasks, in the order they were planned; empty for a record epic.
  repeated EpicBuildTask build_tasks = 7;

  // The orreryd epic's open questions, in the order they were asked; empty for a record epic.
  repeated EpicQuestion questions = 8;

  // The orreryd epic's accepted contract; absent for a record epic. Its Requirements are in requirements.
  EpicContract contract = 9;

  // Whether the orreryd epic is paused, so its planner starts no turn; false for a record epic.
  bool paused = 10;

  // Why the orreryd epic is parked; empty when it is not parked and for a record epic.
  string parked = 11;

  // The orreryd epic's summary paragraph, written once from its contract; empty until it is written and for a record
  // epic.
  string summary = 12;

  // The orreryd epic's end-of-epic review ledger in ledger order; empty before its review freezes and for a record
  // epic.
  repeated EpicLedgerFinding ledger = 13;

  // The orreryd epic's release runs in the order orreryd reads them (by attempt, then part, then position); empty
  // before its release and for a record epic.
  repeated EpicReleaseRun releases = 14;

  // The verdicts of the orreryd epic's epic-stage reviewers by position; empty before its review and for a record epic.
  repeated EpicReviewVerdict reviews = 15;

  // The sessions that work on the epic, each with its newest epic call.
  repeated EpicSession sessions = 16;

  // The absolute path of the git repository the epic belongs to: the orreryd contract's repository, else the record
  // head's workspace. Empty when neither names one.
  string repository = 17;

  // The orreryd epic's release steps in contract order, each with the state its release runs give it; empty for a
  // record epic.
  repeated EpicReleaseProof release_steps = 18;

  // The orreryd epic's report, unset until the epic ends and writes it, and for a record epic.
  EpicReport report = 19;

  // Whether the orreryd epic is parked and the planner holds the park, so the owner is not asked about it; false when it
  // is not parked, when the owner holds its park, and for a record epic. The parked reason is still in parked.
  bool planner_parked = 20;

  // The orreryd epic a close named as its replacement; empty when its close named none, when it is not closed, and for
  // a record epic.
  string superseded_by = 21;
}

// EpicSession is one session that works on an epic, with its newest epic call.
message EpicSession {
  // The session's id in the sessions table.
  string id = 1;

  // The session's tmux pane id; empty for a headless session.
  string pane = 2;

  // The session's label.
  string label = 3;

  // The tool name of the session's newest epic call, such as epic_get.
  string call = 4;

  // When the session's newest epic call was made, in unix seconds.
  int64 at = 5;

  // Whether the session created the epic: its epic_create call created it. A session that called later is not the
  // creator.
  bool creator = 6;
}

// EpicQuestion is one open question a planner turn of an orreryd epic asked.
message EpicQuestion {
  // The question's id, Q<seq>.
  string id = 1;

  // The question.
  string text = 2;

  // The position of the turn that asked the question, counted from 1.
  int64 turn = 3;

  // When the question was asked: the end of the turn that asked it, in unix seconds.
  int64 asked = 4;

  // The label the question is filed under, kebab-case. Empty for a question stored before labels.
  string label = 5;

  // The choices the question declares. The owner may also answer with other, which every question offers.
  repeated EpicQuestionChoice choices = 6;

  // The choice the question recommends, with why and how sure the planner is. Unset when it recommends none.
  EpicRecommendation recommendation = 7;
}

// EpicQuestionChoice is one choice a planner question declares.
message EpicQuestionChoice {
  // The choice's id, the answer the owner gives to choose it.
  string id = 1;

  // What the choice does.
  string does = 2;
}

// EpicRecommendation is the choice a planner question recommends, why, and how sure the planner is of it.
message EpicRecommendation {
  // The recommended choice's id.
  string choice = 1;

  // Why the planner recommends the choice.
  string why = 2;

  // How sure the planner is: low, medium or high.
  string confidence = 3;
}

// EpicContract is an orreryd epic's accepted contract, its sections in the contract's order, without its Requirements.
message EpicContract {
  // The epic's name.
  string title = 1;

  // The sentence of the decision line that approved the contract.
  string approved = 2;

  // What the owner asked for.
  string intent = 3;

  // What could go wrong, each failure with its level of care.
  repeated EpicFailure failures = 4;

  // The level of care the epic is worked at: limited, serious or severe.
  string care = 5;

  // Things the epic adds that the owner did not ask for.
  repeated EpicAddition additions = 6;

  // What the contract assumes, each with what changes if the assumption is wrong.
  repeated EpicPremise premises = 7;

  // What the epic will not do.
  repeated string exclusions = 8;

  // How the epic will be done.
  string approach = 9;

  // The approaches considered and why each was not chosen.
  repeated EpicAlternative alternatives = 10;

  // What leaves the machine when the epic is released, each step with how it is undone.
  repeated EpicReleaseStep release_steps = 11;

  // The Then line that closes the release.
  string release_then = 12;

  // The checks the machines run.
  string checks = 13;

  // The commit the epic starts from, as the full commit id.
  string base = 14;

  // When the contract was accepted, which is when orreryd stored the epic, in unix seconds.
  int64 accepted = 15;
}

// EpicFailure is one failure an epic's contract guards against.
message EpicFailure {
  // The failure's id, F<n>.
  string id = 1;

  // What could go wrong.
  string text = 2;

  // The failure's level of care: limited, serious or severe.
  string rating = 3;

  // What the epic does about the failure.
  string response = 4;
}

// EpicAddition is one thing an epic's contract adds that the owner did not ask for.
message EpicAddition {
  // Where the addition applies, as the contract names it.
  string location = 1;

  // What the addition is.
  string what = 2;

  // Why the epic needs the addition.
  string why = 3;

  // What the addition costs.
  string cost = 4;
}

// EpicPremise is one assumption an epic's contract makes.
message EpicPremise {
  // The premise's id, P<n>.
  string id = 1;

  // The assumption.
  string text = 2;

  // What changes if the assumption is wrong.
  string if_wrong = 3;
}

// EpicAlternative is one approach an epic's contract considered and did not choose.
message EpicAlternative {
  // The approach.
  string alternative = 1;

  // Why the approach was not chosen.
  string why_not = 2;

  // What would make the owner reconsider the approach.
  string reconsider = 3;
}

// EpicReleaseStep is one step of an epic's contract that leaves the machine on release.
message EpicReleaseStep {
  // What the step does.
  string step = 1;

  // Where the step sends what leaves the machine.
  string target = 2;

  // How the step is undone.
  string undo = 3;
}

// EpicsHistoryRequest names one epic and the page of its history to return.
message EpicsHistoryRequest {
  // The epic's id, as List gave it.
  string id = 1;

  // The cursor of the last entry already read; empty starts at the oldest entry.
  string after = 2;

  // The most entries to return: 0 returns 50, and more than 200 returns 200.
  int32 limit = 3;
}

// EpicsHistoryResponse carries one page of an epic's history.
message EpicsHistoryResponse {
  // The entries after the request's cursor, oldest first.
  repeated EpicHistoryEntry entries = 1;

  // The cursor to pass as after for the next page; empty when no entry follows this page.
  string next = 2;
}

// EpicHistoryEntry is one row of an epic's history: a turn, a trigger, a step, an evidence run, a decision or a tell.
message EpicHistoryEntry {
  // The entry's time, in unix seconds: a turn's start, a trigger's creation, a step's start, an evidence run's
  // creation, a decision's recording, or a tell's writing.
  int64 time = 1;

  // The entry's cursor. A History whose after is this cursor returns the entries after this one.
  string cursor = 2;

  // The row the entry carries.
  oneof item {
    // A planner turn.
    EpicTurn turn = 3;

    // A trigger of a planner turn.
    EpicTrigger trigger = 4;

    // A step labelled with the epic.
    EpicStep step = 5;

    // An evidence run.
    EvidenceRun evidence = 6;

    // A decision.
    EpicDecision decision = 7;

    // A tell: what the owner was told.
    EpicTell tell = 8;
  }
}

// EpicTurn is one planner turn of an orreryd epic.
message EpicTurn {
  // The turn's position on the epic, counted from 1.
  int64 seq = 1;

  // The step the turn runs, empty until the turn has one.
  string step = 2;

  // The turn's state: running, succeeded, failed or free.
  string state = 3;

  // Why the turn failed or was freed, empty otherwise.
  string reason = 4;

  // The outline the turn's return gave, empty until the turn succeeds.
  string outline = 5;

  // The outcome the turn's return gave, empty until the turn succeeds.
  string outcome = 6;

  // The decisions the turn's return recorded, in the order they were recorded.
  repeated string decisions = 7;

  // When the turn started, in unix seconds.
  int64 started = 8;

  // When the turn ended, in unix seconds; 0 while the turn runs.
  int64 ended = 9;
}

// EpicTrigger is one cause that asks an orreryd epic's planner for a turn.
message EpicTrigger {
  // The trigger's id.
  string id = 1;

  // What caused the trigger.
  string cause = 2;

  // The trigger's state: pending, claimed or consumed.
  string state = 3;

  // The position of the turn that claimed the trigger; 0 while it is pending.
  int64 turn = 4;

  // When the trigger was created, in unix seconds.
  int64 created = 5;
}

// EpicDecision is one decision recorded on an orreryd epic.
message EpicDecision {
  // The decision's position on the epic, counted from 1.
  int64 seq = 1;

  // The decision's id.
  string id = 2;

  // The decision's text.
  string text = 3;

  // When the decision was recorded, in unix seconds.
  int64 time = 4;

  // The question, Q<n>, the decision answers; empty for a note.
  string question = 5;
}

// EpicTell is one thing an orreryd epic told its owner.
message EpicTell {
  // The tell's position on the epic, counted from 1.
  int64 seq = 1;

  // What the owner was told.
  string text = 2;

  // When the tell was written, in unix seconds.
  int64 at = 3;

  // Whether the owner has been told it.
  bool told = 4;
}

// EpicsPauseRequest names the orreryd epic to pause.
message EpicsPauseRequest {
  // The epic's id.
  string id = 1;
}

// EpicsPauseResponse confirms a paused epic.
message EpicsPauseResponse {}

// EpicsResumeRequest names the orreryd epic to resume.
message EpicsResumeRequest {
  // The epic's id.
  string id = 1;
}

// EpicsResumeResponse carries the limited steps a resume resumed and those a full step cap left limited.
message EpicsResumeResponse {
  // The ids of the limited steps the resume resumed, oldest first.
  repeated string resumed = 1;

  // The ids of the limited steps the resume left limited because the step cap was full, oldest first.
  repeated string still_limited = 2;
}

// EpicsStopRequest names the orreryd epic to stop.
message EpicsStopRequest {
  // The epic's id.
  string id = 1;
}

// EpicsStopResponse confirms a stopped epic.
message EpicsStopResponse {}

// EpicsRetryRequest names the orreryd epic to retry, and the workflow node to rerun when node is set.
message EpicsRetryRequest {
  // The epic's id.
  string id = 1;

  // The workflow node id whose parked runs rerun under their next attempt. Empty ends the epic's park instead.
  string node = 2;
}

// EpicsRetryResponse confirms a retried epic.
message EpicsRetryResponse {}

// EpicsKickRequest records the owner's text on one orreryd epic.
message EpicsKickRequest {
  // The epic's id.
  string id = 1;

  // The owner's words, which the planner reads at the epic's next plan run.
  string text = 2;
}

// EpicsKickResponse confirms a kicked epic.
message EpicsKickResponse {}

// EpicsAnswerRequest records the owner's answer on one orreryd epic.
message EpicsAnswerRequest {
  // The id of the epic the answer belongs to.
  string epic_id = 1;

  // The decision's id, chosen by the caller. A repeated id with the same text returns the first decision.
  string id = 2;

  // The owner's answer.
  string text = 3;

  // The question, Q<n>, the answer names; empty for a note.
  string question = 4;

  // The choice the answer gives to the question: a declared choice's id, or other. Empty for a note.
  string choice = 5;
}

// EpicsAnswerResponse carries the recorded decision.
message EpicsAnswerResponse {
  // The decision recorded, or the decision first recorded under the same id.
  EpicDecision decision = 1;

  // A warning set when a note is recorded while questions are open; empty otherwise.
  string warning = 2;
}

// EpicsSeenRequest names the epic the owner saw.
message EpicsSeenRequest {
  // The epic's id, the same text List gave it.
  string id = 1;
}

// EpicsSeenResponse is the reply to a Seen. It has no fields.
message EpicsSeenResponse {}

// EpicsArchiveRequest names the list row the owner archives.
message EpicsArchiveRequest {
  // The row's kind: epic, session or headless.
  string kind = 1;

  // The row's id, the same text the list gave it.
  string id = 2;
}

// EpicsArchiveResponse is the reply to an Archive. It has no fields.
message EpicsArchiveResponse {}

// EpicsUnarchiveRequest names the list row the owner unarchives.
message EpicsUnarchiveRequest {
  // The row's kind: epic, session or headless.
  string kind = 1;

  // The row's id, the same text the list gave it.
  string id = 2;
}

// EpicsUnarchiveResponse is the reply to an Unarchive. It has no fields.
message EpicsUnarchiveResponse {}

// EpicsReleaseRequest names the orreryd epic to release, and the undo-none release steps to run again.
message EpicsReleaseRequest {
  // The epic's id.
  string id = 1;

  // The positions, from 1, of the undo-none release steps the owner names to run again. Empty names none.
  repeated int32 undo_none = 2;
}

// EpicsReleaseResponse is the reply to a Release. It has no fields.
message EpicsReleaseResponse {}

// EpicsCloseRequest names the orreryd epic to close, how it closes, and the epic that replaces it.
message EpicsCloseRequest {
  // The epic's id.
  string id = 1;

  // The close kind: superseded, shipped or abandoned.
  string kind = 2;

  // The epic that replaces this one. A superseded close requires it.
  string by = 3;
}

// EpicsCloseResponse is the reply to a Close. It has no fields.
message EpicsCloseResponse {}

// Epic is one epic under the record root or in orreryd's database. An id in both is one epic, whose source is orreryd.
message Epic {
  // The epic's id, "<repo-id>/<epic-slug>", the same text a step's epic label carries.
  string id = 1;

  // The repository the epic belongs to, the name of the record directory's parent. An orreryd epic's is the part of
  // its id before the slash.
  string repository = 2;

  // The epic's slug, the name of its record directory. An orreryd epic's is the part of its id after the slash.
  string slug = 3;

  // The outcome the epic's head state.json records, as written. An orreryd epic carries its phase here.
  string outcome = 4;

  // When the epic's head state.json last changed, in unix seconds. An orreryd epic's is its last write.
  int64 changed = 5;

  // Whether the epic is live: its outcome is not released, and it has a running step or changed within a day. An
  // orreryd epic is live until its phase is released or done.
  bool live = 6;

  // The epic's steps that have not ended, held ones included, oldest first.
  repeated EpicStep running_steps = 7;

  // How many of the epic's labelled steps have ended.
  int32 ended_steps = 8;

  // What could not be read from the epic's records, joined with "; ", empty when everything was read.
  string problem = 9;

  // orreryd for an epic orreryd's database holds, record for an epic read from gambit records only.
  string source = 10;

  // The record head state.json's outcome_detail, as written. Empty for an orreryd epic.
  string outcome_detail = 11;

  // Whether the epic is accepted and waiting to start: a live record epic with no outcome, no running step and no
  // effort task. False for an orreryd epic.
  bool waiting = 12;

  // When the orreryd epic's phase was last set, in unix seconds; 0 when unknown and for a record epic.
  int64 phase_at = 13;

  // When the owner last saw the epic, in unix seconds, from its latest Seen; 0 when the owner has not seen it.
  int64 seen = 14;

  // True while the epic is archived: the owner archived it and has not unarchived it since.
  bool archived = 15;

  // How many writes have changed the database epic's row or a row of its parts, its steps aside; 0 for an epic only the
  // records hold. It only grows, so an epic whose revision moved has changed in some part Get answers that this
  // message does not carry, such as its questions, its park, its nodes, its tasks or its ledger.
  int64 revision = 16;
}

// EpicTask is one task from an effort's state.json.
message EpicTask {
  // The effort number, the n of efforts/<n>/state.json.
  int32 effort = 1;

  // The task's slug, as the record wrote it.
  string slug = 2;

  // The task's subject, as the record wrote it.
  string subject = 3;

  // The task's status, free text kept as the record wrote it.
  string status = 4;

  // The requirement ids the task's requirement names, split on commas, each trimmed, empty parts dropped, in order.
  repeated string requirements = 5;
}

// EpicBuildTask is one task of an orreryd epic's plan, with its build.
message EpicBuildTask {
  // The task's id, T<seq>.
  string id = 1;

  // The task's title.
  string title = 2;

  // The task's status: open until it is done.
  string status = 3;

  // The stage the task's build is on: empty before its first unit, then red, implement, green, review or verify.
  string stage = 4;

  // The requirements the task covers.
  repeated string requirements = 5;

  // The red evidence run the build names; absent until the build names one.
  EvidenceRun red = 6;

  // The green evidence run the build names; absent until the build names one.
  EvidenceRun green = 7;

  // The task's reviews, in attempt then position order.
  repeated EpicTaskReview reviews = 8;
}

// EpicTaskReview is one review of a task's build: its attempt, the gate it ran, its step, its verdict and its findings.
message EpicTaskReview {
  // The attempt the review ran in.
  int64 attempt = 1;

  // The review gate the review ran.
  string gate = 2;

  // The step that ran the review.
  string step = 3;

  // The review's verdict: holds or fails.
  string verdict = 4;

  // The findings the review raised, in position order.
  repeated EpicTaskFinding findings = 5;
}

// EpicTaskFinding is one finding a review raised, with its verification.
message EpicTaskFinding {
  // The finding's id.
  string id = 1;

  // The claim the finding makes.
  string claim = 2;

  // Where the finding is located.
  string location = 3;

  // The step that verified the finding; empty until it is verified.
  string step = 4;

  // The verification's result: confirmed, dropped or undecided; empty until it is verified.
  string result = 5;

  // Why the verification gave its result.
  string reason = 6;
}

// EpicReviewVerdict is the verdict of one epic-stage reviewer of an orreryd epic.
message EpicReviewVerdict {
  // The reviewer's position among the epic-stage reviewers, counted from 1.
  int64 position = 1;

  // The reviewer's name.
  string reviewer = 2;

  // The step that ran the review.
  string step = 3;

  // The review's verdict: holds, fails or gap.
  string verdict = 4;

  // Why the review gave its verdict.
  string reason = 5;
}

// EpicLedgerFinding is one finding of an orreryd epic's end-of-epic review ledger, with its verification and closures.
message EpicLedgerFinding {
  // The finding's id, <reviewer>-<k>.
  string id = 1;

  // The position of the finding in the ledger, counted from 1.
  int64 position = 2;

  // The reviewer that raised the finding.
  string reviewer = 3;

  // The claim the finding makes.
  string claim = 4;

  // The citation the finding gives for its claim.
  string citation = 5;

  // Where the finding is located.
  string location = 6;

  // The evidence the finding gives for its claim.
  string evidence = 7;

  // The verifier step that verified the finding; empty when it is unverified.
  string step = 8;

  // The verification's result: confirmed, dropped or undetermined.
  string result = 9;

  // Whether the finding was left unverified.
  bool unverified = 10;

  // Why the verification gave its result, or why the finding was left unverified.
  string reason = 11;

  // The closures the finding went through, in round order.
  repeated EpicClosure closures = 12;
}

// EpicClosure is one round of closing an orreryd epic's ledger finding.
message EpicClosure {
  // The round, counted from 1.
  int64 round = 1;

  // The step that ran the closing check.
  string step = 2;

  // The closing check's result: closed, open or undetermined.
  string result = 3;

  // Why the closing check gave its result.
  string reason = 4;
}

// EpicReleaseRun is one run of an orreryd epic's release, by part, attempt and position.
message EpicReleaseRun {
  // The part the run belongs to: candidate, release, judge or named.
  string part = 1;

  // The run's position within its part and attempt, counted from 1.
  int64 position = 2;

  // The attempt the run belongs to, counted from 1.
  int64 attempt = 3;

  // The release step the run is for.
  string step = 4;

  // The commit the run started from.
  string start = 5;

  // The head the run recorded.
  string head = 6;

  // The end of the run's step, such as done or failed; empty when it has none.
  string end = 7;

  // The commits the run made, in order.
  repeated string commits = 8;

  // The evidence the run gave for its result.
  string evidence = 9;

  // Whether the run passed.
  bool passed = 10;

  // Why the run passed or failed.
  string reason = 11;

  // When the run was recorded, in unix seconds.
  int64 at = 12;
}

// EpicReleaseProof is one release step of an orreryd epic's contract with the state its release runs give it.
message EpicReleaseProof {
  // The step's place in the contract's release steps, counted from 1.
  int64 position = 1;

  // What the step does.
  string step = 2;

  // Where the step sends what leaves the machine.
  string target = 3;

  // How the step is undone.
  string undo = 4;

  // The step's state: waiting, running, passed or failed.
  string state = 5;

  // The evidence the deciding run gave; empty when no run has decided the step.
  string evidence = 6;

  // Why the deciding run passed or failed; empty when no run has decided the step.
  string reason = 7;

  // The attempt the deciding run belongs to, counted from 1.
  int64 attempt = 8;

  // When the deciding run was recorded, in unix seconds; 0 when no run has decided the step.
  int64 at = 9;
}

// EpicReport is what an ended orreryd epic shipped of its contract's Requirements, and what it did not.
message EpicReport {
  // The ending phase the report reports.
  string outcome = 1;

  // The Requirement ids the epic shipped, in contract order.
  repeated string shipped = 2;

  // The Requirement ids the epic did not ship, in contract order.
  repeated string not_shipped = 3;

  // Why the epic shipped what it did and left the rest out.
  string why = 4;
}

// EpicStep is one labelled step of an epic.
message EpicStep {
  // The step's id.
  string id = 1;

  // The step's task label, empty when it has none.
  string task = 2;

  // The agent that runs the step.
  string agent = 3;

  // How the step ended, one of done, returned, goal_unmet, checks_failed, gate_failed, failed, stopped,
  // engine_restarted, overtime, tool_stuck, silent, looping or wedged; empty while it runs. gate_failed is an agent
  // gate step's checked return that did not pass: its assertions did not all hold, its status was not done, or an
  // earlier return of the step held a fails result.
  string end = 4;

  // The step's status.
  string status = 5;

  // Whether the owner has held the step.
  bool held = 6;

  // When the step started, in unix seconds.
  int64 started = 7;

  // When the step ended, in unix seconds, zero while it runs.
  int64 ended = 8;

  // What the step is doing now.
  string doing = 9;

  // The checks the step has run, in round order.
  repeated EpicStepCheck checks = 10;

  // Why the step ended or is held, empty when there is no reason.
  string reason = 11;

  // The stage the step is in: turn, checks, gate, judge, held or limited.
  string stage = 12;

  // When the step's stage started, in unix seconds.
  int64 stage_started = 13;

  // The name of the gate the step's return is checked against. Empty runs no gate.
  string gate_name = 14;

  // The gate's time limit, in seconds.
  int64 gate_limit = 15;

  // Whether a usage limit holds the step, so that it waits for a resume.
  bool limited = 16;

  // The kind of usage limit that holds the step. Empty when no limit holds it or the kind is unknown.
  string limit_kind = 17;

  // When the usage limit that holds the step resets, in unix seconds. Zero when no limit holds it or the reset is
  // unknown.
  int64 limit_resets = 18;

  // Whether the step is read-only.
  bool read_only = 19;

  // The role the step plays: implementer, reviewer, planner or evidence. Empty when it plays none.
  string role = 20;

  // The step's summary, redacted.
  string summary = 21;

  // The step's done-judge verdicts.
  repeated EpicStepVerdict verdicts = 22;
}

// EpicStepCheck is one check a step ran in one round.
message EpicStepCheck {
  // The round the check ran in.
  uint32 round = 1;

  // The check's name.
  string name = 2;

  // Whether the check passed.
  bool ok = 3;

  // The tail of the check's stdout, redacted; set only for a failed gate check.
  string stdout = 4;

  // The tail of the check's stderr, redacted; set only for a failed gate check.
  string stderr = 5;

  // The check's detail, such as the failure it reported, redacted; set for any check.
  string detail = 6;

  // The tail of the check's stdout, redacted; set for any check.
  string tail_stdout = 7;

  // The tail of the check's stderr, redacted; set for any check.
  string tail_stderr = 8;
}

// EpicStepVerdict is one done-judge verdict a step got.
message EpicStepVerdict {
  // The round the verdict was given in.
  uint32 round = 1;

  // The verdict: met, unmet, or empty when the call failed.
  string verdict = 2;

  // Why the judge gave the verdict, redacted.
  string reason = 3;
}

// EpicSlice is one task's rings, read from the task's latest writing step. The rings, outermost first, are red_test,
// working, tests_pass, checks and gate_accepted, so progress moves inward. Evidence that is empty, unparsable, or starts
// NOT RUN (trimmed, any case) counts for nothing.
message EpicSlice {
  // The task label.
  string task = 1;

  // The task's state for the chart's centre readout and its counts, which colours no cell: "dispatched" while the
  // label's latest writing step runs or is held, "done" when it ended done, "gap" for any other end.
  string hue = 2;

  // Whether the latest writing step's result carries red_evidence.
  bool red_test = 3;

  // Whether the latest writing step has run.
  bool working = 4;

  // Whether the latest writing step's result carries green_evidence.
  bool tests_pass = 5;

  // Whether the latest writing step's last round's checks all passed, a gate check among them.
  bool checks = 6;

  // Whether the latest writing step ended done.
  bool gate_accepted = 7;

  // The ring the task is working toward, 1 for red_test through 5 for gate_accepted, while the latest writing step runs
  // or is held: the first ring not yet reached, counting from red_test inward, which is the first of red_test, working,
  // tests_pass, checks, gate_accepted whose field is false; 0 once the step ended.
  int32 at = 8;

  // Whether the latest writing step is held by the owner. False once it has ended.
  bool held = 9;

  // The ring that errored, 1 for red_test through 5 for gate_accepted, when the latest writing step ended any way but
  // done; 0 while it runs or is held, and when it ended done. It is 4 (checks) when the step ended checks_failed, 5
  // (gate_accepted) when it ended goal_unmet, and for every other end the first ring not reached, counted as at counts
  // it.
  int32 error_at = 10;
}

// EpicRequirement is one requirement of an orreryd epic's contract.
message EpicRequirement {
  // The requirement's id, R<n>.
  string id = 1;

  // What will be true when the epic is done.
  string text = 2;

  // The check or review that shows the requirement is true.
  string evidence = 3;

  // How the requirement is shown: check or review.
  string kind = 4;

  // The evidence runs of the requirement.
  repeated EvidenceRun runs = 5;

  // The conclusion the requirement's evidence is judged against.
  string conclusion = 6;
}

// EpicNodeCheck is the check a gate or command node run ran: its state, how it ended, and its output.
message EpicNodeCheck {
  // The check's state: running until it ends, then ended.
  string state = 1;

  // The check's exit code once it ends.
  int32 exit = 2;

  // Whether the check was killed at its time limit.
  bool timed_out = 3;

  // Why the check did not run. Empty otherwise.
  string not_run = 4;

  // The check's stdout, its newest bytes.
  string stdout = 5;

  // The check's stderr, its newest bytes.
  string stderr = 6;
}

// EpicNode is one workflow node run on an epic: the node it runs, its state and outcome, and the rows its kind holds.
message EpicNode {
  // The run's path, unique on the epic.
  string path = 1;

  // The workflow node's id.
  string node = 2;

  // The node's kind, or loop for a loop.
  string kind = 3;

  // The run's state: running, ended or parked.
  string state = 4;

  // The run's outcome once it ends. Empty before.
  string outcome = 5;

  // The innermost enclosing loop's round, 0 outside a loop.
  int64 round = 6;

  // A loop's current round from 1, 0 for any other kind.
  int64 loop_round = 7;

  // The attempt the run runs at. A retry moves it on by one.
  int64 attempt = 8;

  // The output the run ended or parked with.
  string output = 9;

  // The revision the run's work ran at. Empty before the work is prepared.
  string revision = 10;

  // A plan's turn seqs above its mark, in order. Empty for any other kind.
  repeated int64 turns = 11;

  // A plan's task seqs of the turns above its mark, or a build's task seq. Empty for any other kind.
  repeated int64 tasks = 12;

  // An evidence node's evidence runs for its attempt, in the Requirements' order, each as the run the epic lists.
  // Empty for any other kind.
  repeated EvidenceRun runs = 13;

  // A gate or command node's check. Unset until the check is stored.
  EpicNodeCheck check = 14;

  // An agent node's step id. Unset until the step is stored.
  string step = 15;
}

// EvidenceRun is one evidence run: an item's evidence captured or supplied for one phase at a revision, with its
// verdict.
message EvidenceRun {
  // The run's id.
  string id = 1;

  // The phase the run is for: red or green.
  string phase = 2;

  // How the evidence was produced: captured or supplied.
  string source = 3;

  // The run's state: capturing, judging or ended.
  string state = 4;

  // The capture's exit code; for a supplied run, 0 when every file is kept and 1 otherwise.
  int32 exit = 5;

  // Whether the capture was killed at its time limit.
  bool timed_out = 6;

  // Why the capture has no result: could not start, killed at its limit, or lost at a restart. Empty otherwise.
  string not_captured = 7;

  // The judge's verdict: holds, fails, or empty when the judge gave none.
  string verdict = 8;

  // Why the judge gave no verdict. Empty otherwise.
  string judge_reason = 9;

  // Whether the run passes its phase: red when the conclusion fails; green when it holds and the capture exited 0.
  bool passed = 10;

  // The commit the run captured or read at.
  string revision = 11;

  // When the run was created, in unix seconds.
  int64 created = 12;

  // When the run ended, in unix seconds; 0 while it runs.
  int64 ended = 13;

  // The size of the run's stdout log in bytes.
  int64 log_bytes = 14;

  // The artifacts the run kept, each with the state it was kept in.
  repeated EvidenceArtifact artifacts = 15;

  // The size of the run's stderr log in bytes.
  int64 stderr_bytes = 16;

  // The requirement or task whose evidence the run shows. History sets it; Get leaves it empty, since there each run
  // sits under its requirement, node or task.
  string item = 17;
}

// EvidenceArtifact is one file an evidence run kept, with the state it was kept in.
message EvidenceArtifact {
  // The artifact's repository-relative path.
  string path = 1;

  // The artifact's state: kept, missing or over_cap.
  string state = 2;

  // The artifact's size in bytes.
  int64 size = 3;

  // The artifact's media type by extension.
  string media_type = 4;
}

// EvidenceArtifactRequest names one artifact of an evidence run.
message EvidenceArtifactRequest {
  // The evidence run's id.
  string run = 1;

  // The artifact's repository-relative path; empty for the run's log.
  string name = 2;

  // Whether to read the run's stderr log instead of its stdout log; applies only when name is empty.
  bool stderr = 3;
}

// EvidenceArtifactResponse carries one artifact's bytes.
message EvidenceArtifactResponse {
  // The artifact's bytes, or the run's log's bytes.
  bytes data = 1;

  // The artifact's media type by extension.
  string media_type = 2;
}

// StepsHoldRequest names the step to hold.
message StepsHoldRequest {
  // The step's id.
  string id = 1;
}

// StepsHoldResponse confirms a held step.
message StepsHoldResponse {}

// StepsNudgeRequest names the step to nudge and the text to send it.
message StepsNudgeRequest {
  // The step's id.
  string id = 1;

  // The owner's text for the step.
  string text = 2;
}

// StepsNudgeResponse confirms a nudge that landed.
message StepsNudgeResponse {}

// StepsStopRequest names the step to stop.
message StepsStopRequest {
  // The step's id.
  string id = 1;
}

// StepsStopResponse confirms a stopped step.
message StepsStopResponse {}
