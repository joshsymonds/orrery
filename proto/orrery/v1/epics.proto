syntax = "proto3";

package orrery.v1;

// Epics reads the epics under the gambit record root and the epics orreryd's database holds.
service Epics {
  // List returns every epic under the record root and in orreryd's database, one per id, live or folded.
  rpc List(EpicsListRequest) returns (EpicsListResponse);

  // Get returns one epic by the id List gave it.
  rpc Get(EpicsGetRequest) returns (EpicsGetResponse);
}

// Steps carries the owner's calls on one labelled step. It has no call that starts a step.
service Steps {
  // Hold interrupts the step's running turn and holds the step until a nudge or a stop.
  rpc Hold(StepsHoldRequest) returns (StepsHoldResponse);

  // Nudge sends the owner's text to the step.
  rpc Nudge(StepsNudgeRequest) returns (StepsNudgeResponse);

  // Stop ends the step's loop.
  rpc Stop(StepsStopRequest) returns (StepsStopResponse);
}

// Evidence reads the artifacts evidence runs kept.
service Evidence {
  // Artifact returns one artifact of an evidence run, or the run's log when the name is empty.
  rpc Artifact(EvidenceArtifactRequest) returns (EvidenceArtifactResponse);
}

// EpicsListRequest asks for every epic. It has no fields.
message EpicsListRequest {}

// EpicsListResponse carries every epic.
message EpicsListResponse {
  // The epics, sorted by id.
  repeated Epic epics = 1;
}

// EpicsGetRequest names one epic.
message EpicsGetRequest {
  // The epic's id, as List gave it.
  string id = 1;
}

// EpicsGetResponse carries one epic with its tasks and its steps.
message EpicsGetResponse {
  // The epic.
  Epic epic = 1;

  // The tasks of the epic's efforts, effort number ascending and file order within each effort.
  repeated EpicTask tasks = 2;

  // Every step labelled with the epic, oldest first.
  repeated EpicStep steps = 3;

  // A slice per task label among the epic's labelled writing steps, in order of each label's first start. Read-only
  // steps and steps with no task label add none.
  repeated EpicSlice slices = 4;

  // The orreryd epic's requirements in contract order, empty for a record epic.
  repeated EpicRequirement requirements = 5;

  // The orreryd epic's workflow node runs in the engine's order, empty for a record epic.
  repeated EpicNode nodes = 6;

  // The orreryd epic's planned tasks, in the order they were planned; empty for a record epic.
  repeated EpicBuildTask build_tasks = 7;
}

// Epic is one epic under the record root or in orreryd's database. An id in both is one epic, whose source is orreryd.
message Epic {
  // The epic's id, "<repo-id>/<epic-slug>", the same text a step's epic label carries.
  string id = 1;

  // The repository the epic belongs to, the name of the record directory's parent. An orreryd epic's is the part of
  // its id before the slash.
  string repository = 2;

  // The epic's slug, the name of its record directory. An orreryd epic's is the part of its id after the slash.
  string slug = 3;

  // The outcome the epic's head state.json records, as written. An orreryd epic carries its phase here.
  string outcome = 4;

  // When the epic's head state.json last changed, in unix seconds. An orreryd epic's is its last write.
  int64 changed = 5;

  // Whether the epic is live: its outcome is not released, and it has a running step or changed within a day. An
  // orreryd epic is live until its phase is released.
  bool live = 6;

  // The epic's steps that have not ended, held ones included, oldest first.
  repeated EpicStep running_steps = 7;

  // How many of the epic's labelled steps have ended.
  int32 ended_steps = 8;

  // What could not be read from the epic's records, joined with "; ", empty when everything was read.
  string problem = 9;

  // orreryd for an epic orreryd's database holds, record for an epic read from gambit records only.
  string source = 10;

  // The record head state.json's outcome_detail, as written. Empty for an orreryd epic.
  string outcome_detail = 11;

  // Whether the epic is accepted and waiting to start: a live record epic with no outcome, no running step and no
  // effort task. False for an orreryd epic.
  bool waiting = 12;
}

// EpicTask is one task from an effort's state.json.
message EpicTask {
  // The effort number, the n of efforts/<n>/state.json.
  int32 effort = 1;

  // The task's slug, as the record wrote it.
  string slug = 2;

  // The task's subject, as the record wrote it.
  string subject = 3;

  // The task's status, free text kept as the record wrote it.
  string status = 4;

  // The requirement ids the task's requirement names, split on commas, each trimmed, empty parts dropped, in order.
  repeated string requirements = 5;
}

// EpicBuildTask is one task of an orreryd epic's plan, with its build.
message EpicBuildTask {
  // The task's id, T<seq>.
  string id = 1;

  // The task's title.
  string title = 2;

  // The task's status: open until it is done.
  string status = 3;

  // The stage the task's build is on: empty before its first unit, then red, implement, green, review or verify.
  string stage = 4;

  // The requirements the task covers.
  repeated string requirements = 5;

  // The red evidence run the build names; absent until the build names one.
  EvidenceRun red = 6;

  // The green evidence run the build names; absent until the build names one.
  EvidenceRun green = 7;

  // The task's reviews, in attempt then position order.
  repeated EpicTaskReview reviews = 8;
}

// EpicTaskReview is one review of a task's build: its attempt, the gate it ran, its step, its verdict and its findings.
message EpicTaskReview {
  // The attempt the review ran in.
  int64 attempt = 1;

  // The review gate the review ran.
  string gate = 2;

  // The step that ran the review.
  string step = 3;

  // The review's verdict: holds or fails.
  string verdict = 4;

  // The findings the review raised, in position order.
  repeated EpicTaskFinding findings = 5;
}

// EpicTaskFinding is one finding a review raised, with its verification.
message EpicTaskFinding {
  // The finding's id.
  string id = 1;

  // The claim the finding makes.
  string claim = 2;

  // Where the finding is located.
  string location = 3;

  // The step that verified the finding; empty until it is verified.
  string step = 4;

  // The verification's result: confirmed, dropped or undecided; empty until it is verified.
  string result = 5;

  // Why the verification gave its result.
  string reason = 6;
}

// EpicStep is one labelled step of an epic.
message EpicStep {
  // The step's id.
  string id = 1;

  // The step's task label, empty when it has none.
  string task = 2;

  // The agent that runs the step.
  string agent = 3;

  // How the step ended, one of done, returned, goal_unmet, checks_failed, gate_failed, failed, stopped,
  // engine_restarted, overtime, tool_stuck, silent, looping or wedged; empty while it runs. gate_failed is an agent
  // gate step's checked return that did not pass: its assertions did not all hold, its status was not done, or an
  // earlier return of the step held a fails result.
  string end = 4;

  // The step's status.
  string status = 5;

  // Whether the owner has held the step.
  bool held = 6;

  // When the step started, in unix seconds.
  int64 started = 7;

  // When the step ended, in unix seconds, zero while it runs.
  int64 ended = 8;

  // What the step is doing now.
  string doing = 9;

  // The checks the step has run, in round order.
  repeated EpicStepCheck checks = 10;

  // Why the step ended or is held, empty when there is no reason.
  string reason = 11;

  // The stage the step is in: turn, checks, gate, judge, held or limited.
  string stage = 12;

  // When the step's stage started, in unix seconds.
  int64 stage_started = 13;

  // The name of the gate the step's return is checked against. Empty runs no gate.
  string gate_name = 14;

  // The gate's time limit, in seconds.
  int64 gate_limit = 15;

  // Whether a usage limit holds the step, so that it waits for a resume.
  bool limited = 16;

  // The kind of usage limit that holds the step. Empty when no limit holds it or the kind is unknown.
  string limit_kind = 17;

  // When the usage limit that holds the step resets, in unix seconds. Zero when no limit holds it or the reset is
  // unknown.
  int64 limit_resets = 18;

  // Whether the step is read-only.
  bool read_only = 19;

  // The role the step plays: implementer, reviewer, planner or evidence. Empty when it plays none.
  string role = 20;

  // The step's summary, redacted.
  string summary = 21;

  // The step's done-judge verdicts.
  repeated EpicStepVerdict verdicts = 22;
}

// EpicStepCheck is one check a step ran in one round.
message EpicStepCheck {
  // The round the check ran in.
  uint32 round = 1;

  // The check's name.
  string name = 2;

  // Whether the check passed.
  bool ok = 3;

  // The tail of the check's stdout, redacted; set only for a failed gate check.
  string stdout = 4;

  // The tail of the check's stderr, redacted; set only for a failed gate check.
  string stderr = 5;

  // The check's detail, such as the failure it reported, redacted; set for any check.
  string detail = 6;

  // The tail of the check's stdout, redacted; set for any check.
  string tail_stdout = 7;

  // The tail of the check's stderr, redacted; set for any check.
  string tail_stderr = 8;
}

// EpicStepVerdict is one done-judge verdict a step got.
message EpicStepVerdict {
  // The round the verdict was given in.
  uint32 round = 1;

  // The verdict: met, unmet, or empty when the call failed.
  string verdict = 2;

  // Why the judge gave the verdict, redacted.
  string reason = 3;
}

// EpicSlice is one task's rings, read from the task's latest writing step. The rings, outermost first, are red_test,
// working, tests_pass, checks and gate_accepted, so progress moves inward. Evidence that is empty, unparsable, or starts
// NOT RUN (trimmed, any case) counts for nothing.
message EpicSlice {
  // The task label.
  string task = 1;

  // The task's state for the chart's centre readout and its counts, which colours no cell: "dispatched" while the
  // label's latest writing step runs or is held, "done" when it ended done, "gap" for any other end.
  string hue = 2;

  // Whether the latest writing step's result carries red_evidence.
  bool red_test = 3;

  // Whether the latest writing step has run.
  bool working = 4;

  // Whether the latest writing step's result carries green_evidence.
  bool tests_pass = 5;

  // Whether the latest writing step's last round's checks all passed, a gate check among them.
  bool checks = 6;

  // Whether the latest writing step ended done.
  bool gate_accepted = 7;

  // The ring the task is working toward, 1 for red_test through 5 for gate_accepted, while the latest writing step runs
  // or is held: the first ring not yet reached, counting from red_test inward, which is the first of red_test, working,
  // tests_pass, checks, gate_accepted whose field is false; 0 once the step ended.
  int32 at = 8;

  // Whether the latest writing step is held by the owner. False once it has ended.
  bool held = 9;

  // The ring that errored, 1 for red_test through 5 for gate_accepted, when the latest writing step ended any way but
  // done; 0 while it runs or is held, and when it ended done. It is 4 (checks) when the step ended checks_failed, 5
  // (gate_accepted) when it ended goal_unmet, and for every other end the first ring not reached, counted as at counts
  // it.
  int32 error_at = 10;
}

// EpicRequirement is one requirement of an orreryd epic's contract.
message EpicRequirement {
  // The requirement's id, R<n>.
  string id = 1;

  // What will be true when the epic is done.
  string text = 2;

  // The check or review that shows the requirement is true.
  string evidence = 3;

  // How the requirement is shown: check or review.
  string kind = 4;

  // The evidence runs of the requirement.
  repeated EvidenceRun runs = 5;

  // The conclusion the requirement's evidence is judged against.
  string conclusion = 6;
}

// EpicNodeCheck is the check a gate or command node run ran: its state, how it ended, and its output.
message EpicNodeCheck {
  // The check's state: running until it ends, then ended.
  string state = 1;

  // The check's exit code once it ends.
  int32 exit = 2;

  // Whether the check was killed at its time limit.
  bool timed_out = 3;

  // Why the check did not run. Empty otherwise.
  string not_run = 4;

  // The check's stdout, its newest bytes.
  string stdout = 5;

  // The check's stderr, its newest bytes.
  string stderr = 6;
}

// EpicNode is one workflow node run on an epic: the node it runs, its state and outcome, and the rows its kind holds.
message EpicNode {
  // The run's path, unique on the epic.
  string path = 1;

  // The workflow node's id.
  string node = 2;

  // The node's kind, or loop for a loop.
  string kind = 3;

  // The run's state: running, ended or parked.
  string state = 4;

  // The run's outcome once it ends. Empty before.
  string outcome = 5;

  // The innermost enclosing loop's round, 0 outside a loop.
  int64 round = 6;

  // A loop's current round from 1, 0 for any other kind.
  int64 loop_round = 7;

  // The attempt the run runs at. A retry moves it on by one.
  int64 attempt = 8;

  // The output the run ended or parked with.
  string output = 9;

  // The revision the run's work ran at. Empty before the work is prepared.
  string revision = 10;

  // A plan's turn seqs above its mark, in order. Empty for any other kind.
  repeated int64 turns = 11;

  // A plan's task seqs of the turns above its mark, or a build's task seq. Empty for any other kind.
  repeated int64 tasks = 12;

  // An evidence node's evidence runs for its attempt, in the Requirements' order, each as the run the epic lists.
  // Empty for any other kind.
  repeated EvidenceRun runs = 13;

  // A gate or command node's check. Unset until the check is stored.
  EpicNodeCheck check = 14;

  // An agent node's step id. Unset until the step is stored.
  string step = 15;
}

// EvidenceRun is one evidence run: an item's evidence captured or supplied for one phase at a revision, with its
// verdict.
message EvidenceRun {
  // The run's id.
  string id = 1;

  // The phase the run is for: red or green.
  string phase = 2;

  // How the evidence was produced: captured or supplied.
  string source = 3;

  // The run's state: capturing, judging or ended.
  string state = 4;

  // The capture's exit code; for a supplied run, 0 when every file is kept and 1 otherwise.
  int32 exit = 5;

  // Whether the capture was killed at its time limit.
  bool timed_out = 6;

  // Why the capture has no result: could not start, killed at its limit, or lost at a restart. Empty otherwise.
  string not_captured = 7;

  // The judge's verdict: holds, fails, or empty when the judge gave none.
  string verdict = 8;

  // Why the judge gave no verdict. Empty otherwise.
  string judge_reason = 9;

  // Whether the run passes its phase: red when the conclusion fails; green when it holds and the capture exited 0.
  bool passed = 10;

  // The commit the run captured or read at.
  string revision = 11;

  // When the run was created, in unix seconds.
  int64 created = 12;

  // When the run ended, in unix seconds; 0 while it runs.
  int64 ended = 13;

  // The size of the run's stdout log in bytes.
  int64 log_bytes = 14;

  // The artifacts the run kept, each with the state it was kept in.
  repeated EvidenceArtifact artifacts = 15;

  // The size of the run's stderr log in bytes.
  int64 stderr_bytes = 16;
}

// EvidenceArtifact is one file an evidence run kept, with the state it was kept in.
message EvidenceArtifact {
  // The artifact's repository-relative path.
  string path = 1;

  // The artifact's state: kept, missing or over_cap.
  string state = 2;

  // The artifact's size in bytes.
  int64 size = 3;

  // The artifact's media type by extension.
  string media_type = 4;
}

// EvidenceArtifactRequest names one artifact of an evidence run.
message EvidenceArtifactRequest {
  // The evidence run's id.
  string run = 1;

  // The artifact's repository-relative path; empty for the run's log.
  string name = 2;

  // Whether to read the run's stderr log instead of its stdout log; applies only when name is empty.
  bool stderr = 3;
}

// EvidenceArtifactResponse carries one artifact's bytes.
message EvidenceArtifactResponse {
  // The artifact's bytes, or the run's log's bytes.
  bytes data = 1;

  // The artifact's media type by extension.
  string media_type = 2;
}

// StepsHoldRequest names the step to hold.
message StepsHoldRequest {
  // The step's id.
  string id = 1;
}

// StepsHoldResponse confirms a held step.
message StepsHoldResponse {}

// StepsNudgeRequest names the step to nudge and the text to send it.
message StepsNudgeRequest {
  // The step's id.
  string id = 1;

  // The owner's text for the step.
  string text = 2;
}

// StepsNudgeResponse confirms a nudge that landed.
message StepsNudgeResponse {}

// StepsStopRequest names the step to stop.
message StepsStopRequest {
  // The step's id.
  string id = 1;
}

// StepsStopResponse confirms a stopped step.
message StepsStopResponse {}
