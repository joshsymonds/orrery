syntax = "proto3";

package orrery.v1;

// Designs reads the designs orreryd stores. serve forwards each call of the service to orreryd.
service Designs {
  // List returns every design, with its contracts.
  rpc List(DesignsListRequest) returns (DesignsListResponse);

  // Get returns one design by the id List gave it.
  rpc Get(DesignsGetRequest) returns (DesignsGetResponse);

  // Answer gives the owner's answer to a question of a design's stage. serve forwards each call to orreryd.
  rpc Answer(DesignsAnswerRequest) returns (DesignsAnswerResponse);

  // Continue returns a design and the session that continues its stage. serve forwards each call to orreryd.
  rpc Continue(DesignsContinueRequest) returns (DesignsContinueResponse);
}

// DesignsListRequest asks for every design.
message DesignsListRequest {}

// DesignsListResponse carries every design.
message DesignsListResponse {
  // The designs, sorted by id.
  repeated Design designs = 1;
}

// DesignsGetRequest names one design.
message DesignsGetRequest {
  // The design's id, as List gave it.
  string id = 1;
}

// DesignsGetResponse carries one design with its stage's approaches, choice, log and delegations.
message DesignsGetResponse {
  // The design.
  Design design = 1;

  // The approaches the design's stage weighs, oldest first.
  repeated DesignApproach approaches = 2;

  // The approach the owner chose for the design; unset until a choice is stored.
  DesignChoice choice = 3;

  // The log of the design's stage, oldest first.
  repeated DesignLogLine log = 4;

  // The owner's delegations of the design's decisions to the conversation, oldest first.
  repeated DesignDelegation delegations = 5;

  // The design's stage; unset when serve has no stage service.
  DesignStage stage = 6;
}

// RecordMaker is who made a stage record and the evidence it rests on.
message RecordMaker {
  // Who made the record: owner_serve for the owner through serve's call, owner_conversation for the owner in the
  // conversation, or conversation for the owner as the conversation decided for him.
  string kind = 1;

  // The owner's words the record quotes; set for owner_conversation.
  string quote = 2;

  // Why the conversation decided for the owner; set for conversation.
  string reason = 3;

  // The owner's words that let the conversation decide for him; set for conversation.
  string delegation = 4;

  // The sessions row id of the session that made the record, or empty when none did.
  string session = 5;
}

// DesignApproach is an approach a design's stage weighs, with its trade-offs and whether the planner recommends it.
message DesignApproach {
  // The approach's seq, counted from 1 within its design.
  int64 seq = 1;

  // The approach's name.
  string name = 2;

  // The shape the approach takes.
  string shape = 3;

  // What the approach costs.
  string cost = 4;

  // What the approach wins.
  string wins = 5;

  // What the approach loses.
  string loses = 6;

  // What would make the planner reconsider the approach.
  string reconsider = 7;

  // The ids of the research steps the approach rests on.
  repeated string research = 8;

  // True when the planner recommends the approach.
  bool recommended = 9;

  // Why the planner recommends the approach or does not.
  string reason = 10;

  // When the approach was stored, in unix seconds.
  int64 time = 11;
}

// DesignChoice is the approach the owner chose for a design, with the maker it came from.
message DesignChoice {
  // The seq of the chosen approach.
  int64 approach = 1;

  // The owner's words the choice is made with.
  string words = 2;

  // Who made the choice and the evidence it rests on.
  RecordMaker maker = 3;

  // When the choice was stored, in unix seconds.
  int64 time = 4;
}

// DesignLogLine is one line of a design's stage log: what was done, by whom, and the ids it touched.
message DesignLogLine {
  // The line's seq, counted from 1 within its design.
  int64 seq = 1;

  // When the line was logged, in unix seconds.
  int64 time = 2;

  // Who did the thing the line logs and the evidence it rests on.
  RecordMaker maker = 3;

  // The sessions row id of the session that logged the line.
  string session = 4;

  // What was done.
  string what = 5;

  // The ids the line touched.
  repeated string ids = 6;

  // The words the line was logged with.
  string words = 7;
}

// DesignDelegation is the owner's delegation of a design's decisions to the conversation, with the decisions the
// conversation made under it.
message DesignDelegation {
  // The delegation's seq, counted from 1 within its design.
  int64 seq = 1;

  // The kinds of decision the delegation covers.
  repeated string kinds = 2;

  // The owner's words the delegation is given with.
  string message = 3;

  // The sessions row id of the session that stored the delegation.
  string session = 4;

  // When the delegation was stored, in unix seconds.
  int64 time = 5;

  // The decisions the conversation made under the delegation, oldest first.
  repeated DesignDecision decisions = 6;
}

// DesignDecision is a decision the conversation made under a delegation.
message DesignDecision {
  // The decision's kind.
  string kind = 1;

  // The id of the thing the decision concerns.
  string ref = 2;

  // The decision's text.
  string text = 3;

  // Why the conversation decided.
  string reason = 4;

  // When the decision was made, in unix seconds.
  int64 time = 5;
}

// DesignStep is a research, reproduction or steelman step a design's stage started, with its report once it returns.
message DesignStep {
  // The step's id.
  string step = 1;

  // The step's kind: research, reproduce, discovery or closure.
  string kind = 2;

  // What the step looks into.
  string subject = 3;

  // The step's status: running until the step ends, then its status.
  string status = 4;

  // The step's report, or its output, empty until it returns.
  string report = 5;

  // The verdict of a steelman pass, empty for the other kinds and until the pass returns.
  string verdict = 6;

  // True when the step counts toward the design's budget of passes.
  bool counted = 7;

  // When the step was started, in unix seconds.
  int64 created = 8;
}

// DesignQuestion is a question a design's stage asks, about one of its contracts, with its answer once one is given.
message DesignQuestion {
  // The question's id, counted from 1 within its design.
  int64 id = 1;

  // The id of the contract the question concerns, empty when it concerns none.
  string contract = 2;

  // The question's text.
  string text = 3;

  // The options the owner may choose between.
  repeated string options = 4;

  // The option the planner recommends.
  string recommendation = 5;

  // When the question was asked, in unix seconds.
  int64 asked = 6;

  // The answer's words; empty while the question is open.
  string answer = 7;

  // True when the answer is the recommendation the planner gave.
  bool accepted = 8;

  // Who answered the question and the evidence the answer rests on; empty while the question is open.
  RecordMaker maker = 9;

  // When the question was answered, in unix seconds; zero while the question is open.
  int64 answered = 10;
}

// DesignLedgerItem is a finding a design's stage raised, with its disposition once one is given.
message DesignLedgerItem {
  // The item's id, counted from 1 within its design.
  string id = 1;

  // The id of the contract the item concerns, empty when it concerns none.
  string contract = 2;

  // Where the item came from: discovery for the steelman's discovery pass, or closure for its closure pass.
  string origin = 3;

  // What the item would change if it held.
  string impact = 4;

  // The evidence the item rests on.
  string evidence = 5;

  // The change the item proposes to the contract.
  string change = 6;

  // The item's disposition: open, adopted, rejected or deferred.
  string disposition = 7;

  // Why the item was rejected or deferred; empty otherwise.
  string reason = 8;

  // The boundary the item was deferred to; empty unless it was deferred.
  string boundary = 9;

  // Who gave the disposition and the evidence it rests on; empty while the item is open.
  RecordMaker maker = 10;

  // Closure's word on the item, empty until closure gives one.
  string closure_word = 11;

  // Closure's note on the item, empty until closure gives one.
  string closure_note = 12;
}

// DesignStage is the stage of one design: the steps it started, the questions it asked, the ledger of its findings and
// the counts of its passes.
message DesignStage {
  // The steps the design's stage started, oldest first.
  repeated DesignStep steps = 1;

  // The questions the design's stage asked, oldest first.
  repeated DesignQuestion questions = 2;

  // The ledger of the design's findings, oldest first.
  repeated DesignLedgerItem ledger = 3;

  // True when the ledger is frozen: closure has started or was recorded skipped, and no disposition changes after.
  bool frozen = 4;

  // True when the design's closure pass was recorded as skipped.
  bool closure_skipped = 5;

  // True when the design's discovery pass has counted toward its budget.
  bool discovery_counted = 6;

  // True when the design's closure pass has counted toward its budget.
  bool closure_counted = 7;
}

// Design is a design as the clients read it: its contracts and the order they start in.
message Design {
  // The design's id.
  string id = 1;

  // The design's title.
  string title = 2;

  // The id of the conversation that works the design.
  string conversation = 3;

  // The unix seconds the design was created.
  int64 created = 4;

  // True when the design is a design of one: the contract that reads as it was proposed with no design.
  bool of_one = 5;

  // The design's state phrase, given by the server.
  string state = 6;

  // The design's contracts, in position order.
  repeated DesignContract contracts = 7;
}

// DesignContract is a contract as its design holds it: its place in the start order and the contracts it starts after.
message DesignContract {
  // The contract's id.
  string id = 1;

  // The contract's title.
  string title = 2;

  // The repository the contract changes.
  string repository = 3;

  // The contract's state.
  string state = 4;

  // The contract's place in its design's start order, counted from 1.
  int64 position = 5;

  // The ids of the contracts this one starts after, all of the same design. Empty names none.
  repeated string after = 6;

  // The id of the epic made from the contract, or empty when none has been made.
  string epic = 7;

  // The phase of that epic, or empty when none has been made.
  string epic_phase = 8;
}

// DesignsAnswerRequest asks for the owner's answer to a question of a design's stage to be stored.
message DesignsAnswerRequest {
  // The design the question belongs to.
  string design = 1;

  // The id of the question, as the stage gave it.
  int64 question = 2;

  // The owner's answer's words.
  string answer = 3;

  // True when the owner accepts the question's recommendation as the answer.
  bool accept = 4;
}

// DesignsAnswerResponse carries the answer orreryd stored.
message DesignsAnswerResponse {
  // The answer's words, as orreryd stored them.
  string answer = 1;
}

// DesignsContinueRequest names the design whose stage continues.
message DesignsContinueRequest {
  // The design's id, as List gave it.
  string id = 1;
}

// DesignsContinueResponse carries the design and the session that continues its stage.
message DesignsContinueResponse {
  // The design, as Get gives it.
  Design design = 1;

  // The sessions row id of the session that continues the stage.
  string session = 2;
}
