org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Orrery's gates and evidence runs build in fresh worktrees that share one Gradle home, so the build cache lets each
# reuse the compile, dex and lint outputs of any earlier run with the same inputs. Test tasks stay out of it (see
# app/build.gradle.kts).
org.gradle.caching=true
